<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自动控制理论 · 课堂优化版</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../theme/katex/katex.min.css">
<link rel="stylesheet" href="../theme/theme.css">
<link rel="stylesheet" href="../theme/chapter01.css">
<link rel="stylesheet" href="../theme/visual-plots.css">
<link rel="stylesheet" href="../theme/source-order.css">
<link rel="stylesheet" href="../theme/edition.css">
<link rel="stylesheet" href="../theme/classroom.css">
<link rel="stylesheet" href="../theme/frame.css">
<script src="player.js" defer></script>
</head>
<body class="source-order">
  <a class="skip-slide" href="#frame">跳至当前课件</a>
  <header class="reader-bar">
    <button id="outline" type="button" aria-label="打开章内页目" aria-haspopup="dialog" aria-controls="outline-dialog" aria-expanded="false"><span>页目</span><span aria-hidden="true">›</span></button>
    <strong>自动控制理论</strong>
    <select id="chapter-choice" aria-label="选择章节"></select>
    <button id="fullscreen" type="button" aria-label="全屏">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M3 13v4h4m10-4v4h-4"/></svg>
      <span>全屏</span>
    </button>
  </header>
  <div class="reader-body">
    <iframe id="frame" title="课件放映"></iframe>
    <p id="load-error" role="alert" hidden>课件载入失败，请刷新页面重试。</p>
  </div>
  <footer class="reader-footer" aria-label="课件翻页">
    <button id="previous" type="button">‹ 上一页</button>
    <span id="folio" aria-live="polite"></span>
    <button id="next" type="button">下一页 ›</button>
  </footer>
  <dialog id="outline-dialog" aria-labelledby="outline-title">
    <header><h2 id="outline-title">章内页目</h2><button type="button" data-close>收起</button></header>
    <nav id="compact-list" aria-label="章内页目"></nav>
  </dialog>
</body>
</html>
