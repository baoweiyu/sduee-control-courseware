<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>教学环节</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=218">
<script src="../../../theme/act-base.js?v=218" defer></script>
<style>
  .cols { display:flex; gap:36px; height:600px; margin-top:10px; }
  .col { flex:1; display:flex; flex-direction:column; }
  .hours { font-size:44px; color:var(--orange); font-weight:800; margin-left:auto; }
  .item { display:flex; align-items:center; gap:18px; background:var(--sky); border-radius:14px; padding:20px 24px; margin:14px 26px; font-size:25px; color:var(--navy); flex:1; border:2px solid transparent; }
  .item b { font-size:30px; color:#D63A2F; margin-left:auto; }
  .item.key { border-color:#D63A2F; background:#FDF3F1; font-weight:700; }
  .item.key b { font-size:34px; }
  .item .dot { width:14px; height:14px; border-radius:50%; background:var(--blue2); flex:none; }
  .item.key .dot { background:#D63A2F; }
</style>
</head>
<body data-title="教学环节：线下 + 线上" data-page="3 / 35">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="cols">
      <div class="act-card col">
        <div class="hd">线下授课<span class="hours">52 学时</span></div>
        <div class="item key"><span class="dot"></span>课堂理论教学<b>44 学时</b></div>
        <div class="item"><span class="dot"></span>物理实验<b>6 学时</b></div>
        <div class="item"><span class="dot"></span>课程设计<b>2 学时</b></div>
      </div>
      <div class="act-card col">
        <div class="hd">线上教学<span class="hours">16 学时</span></div>
        <div class="item"><span class="dot"></span>慕课（智慧树平台）</div>
        <div class="item"><span class="dot"></span>MATLAB 仿真分析（讨论题、项目设计）</div>
      </div>
    </div>
  </div>
  <div class="act-note">
    <svg class="ico" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#1D3FA0" stroke-width="3"/><path d="M24 14 v10 l7 5" fill="none" stroke="#F5821F" stroke-width="3" stroke-linecap="round"/></svg>
    <span><span class="lead">总学时：</span>全课程共 <b>68 学时</b>（线下 52 + 线上 16）；主线：模型 — 分析 — 设计 — 应用。</span>
  </div>
</div></div>
</body>
</html>
