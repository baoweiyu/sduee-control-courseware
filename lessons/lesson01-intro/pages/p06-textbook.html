<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>教材信息</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=218">
<script src="../../../theme/act-base.js?v=218" defer></script>
<style>
  .cols { display:flex; gap:48px; height:656px; align-items:stretch; margin-top:6px; }
  .book { flex:0 0 430px; display:grid; place-items:center; padding:26px; background:var(--sky); }
  .book img { max-height:560px; max-width:100%; object-fit:contain; box-shadow:0 10px 28px rgba(18,38,110,.18); border-radius:6px; }
  .info { flex:1; display:flex; flex-direction:column; gap:30px; justify-content:center; }
  .info .row { background:#fff; border:2px solid var(--line); border-radius:14px; padding:20px 28px; font-size:25px; color:var(--ink); }
  .info .row b { color:var(--navy); }
  .badge-line { display:inline-block; background:var(--orange); color:#fff; font-size:21px; font-weight:700; border-radius:10px; padding:6px 18px; width:max-content; }
</style>
</head>
<body data-title="课程教材" data-page="6 / 35">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="cols">
      <div class="act-card book"><img src="../../../assets/legacy/chapt1/textbook-4th.png" alt="《自动控制理论（第四版）》教材封面"></div>
      <div class="info">
        <span class="badge-line">「十三五」普通高等教育本科规划教材</span>
        <div class="row" style="font-size:32px;font-weight:700;color:var(--navy)">自动控制理论（第四版）</div>
        <div class="row"><b>主编：</b>陈青</div>
        <div class="row"><b>出版社：</b>中国电力出版社，2017.7</div>
      </div>
    </div>
  </div>
</div></div>
</body>
</html>
