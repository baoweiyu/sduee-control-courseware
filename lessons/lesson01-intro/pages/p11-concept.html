    <div class="sec">一、自动控制的概念</div>
    <div class="def">
      自动控制是指在<span class="kw-r">无人直接参与</span>的情况下，利用自动控制装置（简称<span class="kw-b">控制器</span>）使整个生产过程或工作机械（称为<span class="kw-g">被控对象</span>）自动地按<span class="kw-r">预先规定的规律</span>运行，或使它的某些参数（称为<span class="kw-g">被控量</span>）按<span class="kw-r">预定要求</span>变化的性能或过程。
    </div>
    <div class="legend">
      <span><b class="kw-r">■</b>关键要素：① 控制主体 = 控制器　② 作用对象 = 被控对象 / 被控量　③ 前提要求 = 预定规律</span>
    </div>
    </div>
  </div>
  <div class="act-note">
    <svg class="ico" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#1D3FA0" stroke-width="3"/><path d="M17 24 l5 5 10-11" fill="none" stroke="#F5821F" stroke-width="3.5" stroke-linecap="round"/></svg>
    <span><span class="lead">抓三问：</span>谁控制（控制器）？控制谁（被控对象/被控量）？按什么控制（预定规律/要求）？</span>
  </div>
