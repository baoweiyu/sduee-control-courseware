<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>应用实例 · 无人机与天问一号</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .imgs { display:flex; gap:28px; height:520px; margin-top:4px; }
  .imgc { flex:1; position:relative; overflow:hidden; }
  .imgc .hd { font-size:24px; }
  .imgc .bd2 { height:438px; display:grid; place-items:center; background:var(--sky); padding:10px; }
  .imgc img { max-width:100%; max-height:100%; object-fit:contain; }
  .flow { display:flex; align-items:stretch; gap:14px; margin-top:24px; }
  .flow .lead { flex:0 0 240px; font-size:23px; font-weight:700; color:var(--navy); line-height:1.4; align-self:center; }
  .stepb { flex:1; background:var(--sky); border-radius:14px; padding:14px 16px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .stepb b { display:block; font-size:21px; color:var(--navy); margin-bottom:6px; }
  .stepb span { font-size:17.5px; color:var(--muted); line-height:1.4; display:block; }
  .stepb .em { color:#D63A2F; font-weight:700; }
  .flow .arr { color:var(--orange); font-size:30px; font-weight:700; flex:none; align-self:center; }
</style>
</head>
<body data-title="自动控制就在身边：无人机与天问一号" data-page="12 / 35">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="imgs">
      <div class="act-card imgc">
        <div class="hd">侦察无人机（阅兵公开亮相）</div>
        <div class="bd2">
          <img src="../../../assets/image2/uav-recon.png" alt="高空侦察无人机">
        </div>
      </div>
      <div class="act-card imgc">
        <div class="hd">天问一号火星着陆</div>
        <div class="bd2">
          <img src="../../../assets/image2/tianwen-landing.png" alt="天问一号着陆火星示意">
        </div>
      </div>
    </div>
    <div class="flow">
      <div class="lead">天问一号的「惊魂 9 分钟」<br>全自主着陆过程：</div>
      <div class="stepb"><b>气动减速</b><span>借助火星大气<br><span class="em">20000 km/h 减掉约 90%</span></span></div>
      <div class="arr">➜</div>
      <div class="stepb"><b>伞系减速</b><span>打开降落伞<br>降至 <span class="em">100 m/s</span></span></div>
      <div class="arr">➜</div>
      <div class="stepb"><b>动力减速</b><span>反推发动机工作<br>进入动力减速段</span></div>
      <div class="arr">➜</div>
      <div class="stepb"><b>着陆缓冲</b><span>距火星表面 <span class="em">100 m</span><br>缓冲机构与气囊保护</span></div>
    </div>
  </div>
</div></div>
</body>
</html>
