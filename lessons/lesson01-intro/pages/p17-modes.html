<style>

<body data-title="二、自动控制的基本方式" data-page="17 / 35">
<div class="act-stage"><div class="act-slide">

    <div class="cards">
      <div class="act-card cc"><div class="n">1</div><h3>开环控制</h3><div class="k">输出量不参与控制</div><p>信号单向传递<br>结构简单、成本低</p></div>
