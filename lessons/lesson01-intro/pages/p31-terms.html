<body data-title="控制系统中的常用术语" data-page="31 / 35">
<div class="act-stage"><div class="act-slide">
  <div class="act-body fill">
    <div class="list">
      <div class="trow" data-step="1"><span class="no">1</span><span class="tname">给定量（输入量）</span><span class="tdef">系统输出量的<span class="em">要求值</span></span></div>
      <div class="trow" data-step="2"><span class="no">2</span><span class="tname">被控量（输出量）</span><span class="tdef">被控系统所控制的<span class="em">物理量</span></span></div>

      <div class="trow" data-step="7"><span class="no">7</span><span class="tname">被控对象</span><span class="tdef">被控制的<span class="em">机器、设备或生产过程</span></span></div>

  </div>
