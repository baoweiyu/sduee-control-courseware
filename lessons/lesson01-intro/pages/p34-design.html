<!DOCTYPE html>

<style>
  .prin { background:#fff; border:2px solid var(--line); border-left:12px solid var(--blue); border-radius:16px; padding:30px 38px; font-size:27px; line-height:1.85; color:var(--ink); margin:6px 0 44px; }

  .st .no { width:72px; height:72px; border-radius:50%; background:var(--blue); color:#fff; font-size:31px; font-weight:700; display:grid; place-items:center; margin:0 auto 16px; flex:none; }

<body data-title="二、自动控制系统的设计原则" data-page="34 / 35">
<div class="act-stage"><div class="act-slide">

      <div class="arr">➜</div>
      <div class="st"><div class="no">2</div><div class="bx"><b>系统设计</b><span>确定结构与参数，选择校正方案</span></div></div>
      <div class="arr">➜</div>
      <div class="st"><div class="no">3</div><div class="bx"><b>实验仿真</b><span>仿真验证设计结果</span></div></div>
      <div class="arr">➜</div>
      <div class="st"><div class="no">4</div><div class="bx"><b>控制实现</b><span>工程实现与调试运行</span></div></div>
    </div>
  </div>
  <div class="act-note">
