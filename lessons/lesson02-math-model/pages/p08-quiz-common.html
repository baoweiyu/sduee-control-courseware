<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 三例共同点（多选）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=218">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=218" defer></script>
<style>
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:20px; font-weight:700; border-radius:10px; padding:6px 18px; margin-bottom:24px; }
  .q { font-size:30px; font-weight:700; color:var(--navy); margin-bottom:30px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .opt { display:flex; align-items:center; gap:18px; background:#fff; border:2px solid var(--line); border-radius:14px; padding:24px 26px; font-size:26px; color:var(--ink); }
  .opt .k { width:46px; height:46px; border-radius:50%; background:var(--sky); color:var(--blue); font-weight:700; display:grid; place-items:center; flex:none; font-size:23px; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right .k { background:#1E9E57; color:#fff; }
  .opt.right::after { content:"✓"; margin-left:auto; color:#1E9E57; font-weight:800; font-size:30px; }
  .opt.dim { opacity:.5; }
  .ans { margin-top:28px; font-size:25px; color:var(--navy); background:var(--sky); border-radius:14px; padding:16px 28px; }
  .ans b { color:var(--danger); }
  .stage-tip { display:inline-block; margin-bottom:18px; font-size:20px; color:#fff; background:var(--blue); border-radius:20px; padding:5px 18px; width:fit-content; }
</style>
</head>
<body data-title="课堂互动 · 多选" data-page="8 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body" style="display:flex;flex-direction:column;justify-content:center">
    <span class="qtype">多选题　2 分</span>
    <div class="q">前述 RLC 电路、弹簧-质量-阻尼器、直流电动机三个算例系统的共同点（　）</div>
    <div class="opts">
      <div class="opt" data-step="1" data-mark="0"><span class="k">A</span>都是二阶系统</div>
      <div class="opt" data-step="2" data-mark="0"><span class="k">B</span>都是单输入的</div>
      <div class="opt" data-step="3" data-mark="0"><span class="k">C</span>都是线性系统</div>
      <div class="opt" data-step="4" data-mark="1"><span class="k">D</span>以上都对</div>
    </div>
    <div data-step="5" style="display:none"></div>
    <div class="ans" data-step="6"><b>答案：D。</b>三个系统物理性质完全不同（电、机械、机电），但数学模型都是单输入的二阶线性微分方程——这正是用数学模型统一研究各类系统的意义。</div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          o.classList.toggle("right", S.cur >= 5 && o.dataset.mark === "1");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
