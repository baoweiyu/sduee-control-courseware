<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 稳态解与暂态解（单选）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:20px; font-weight:700; border-radius:10px; padding:6px 18px; margin-bottom:24px; }
  .q { font-size:29px; font-weight:700; color:var(--navy); margin-bottom:30px; }
  .opts { display:flex; flex-direction:column; gap:18px; }
  .opt { display:flex; align-items:center; gap:18px; background:#fff; border:2px solid var(--line); border-radius:14px; padding:20px 26px; font-size:24px; color:var(--ink); }
  .opt .k { width:46px; height:46px; border-radius:50%; background:var(--sky); color:var(--blue); font-weight:700; display:grid; place-items:center; flex:none; font-size:23px; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right .k { background:#1E9E57; color:#fff; }
  .opt.right::after { content:"✓"; margin-left:auto; color:#1E9E57; font-weight:800; font-size:28px; }
  .opt.dim { opacity:.5; }
  .ans { margin-top:26px; font-size:24px; color:var(--navy); background:var(--sky); border-radius:14px; padding:16px 28px; }
  .ans b { color:var(--danger); }
</style>
</head>
<body data-title="课堂互动 · 单选" data-page="14 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body" style="display:flex;flex-direction:column;justify-content:center">
    <span class="qtype">单选题　1 分</span>
    <div class="q">以下说法正确的是（　）</div>
    <div class="opts">
      <div class="opt" data-step="1" data-mark="1"><span class="k">A</span>系统微分方程的稳态解反映系统响应输入信号作用的稳态精度</div>
      <div class="opt" data-step="2" data-mark="0"><span class="k">B</span>系统微分方程的暂态解仅与给定初始条件有关</div>
      <div class="opt" data-step="3" data-mark="0"><span class="k">C</span>系统微分方程的零初始状态响应是其稳态解</div>
      <div class="opt" data-step="4" data-mark="0"><span class="k">D</span>以上都不对</div>
    </div>
    <div data-step="5" style="display:none"></div>
    <div class="ans" data-step="6"><b>答案：A。</b>暂态解由系统结构和输入共同决定（不只与初始条件有关）；零初始状态响应 = 稳态解 + 暂态解，二者缺一不可。</div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          o.classList.toggle("right", S.cur >= 5 && o.dataset.mark === "1");
          o.classList.toggle("dim", S.cur >= 5 && o.dataset.mark === "0");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
