<body data-title="第二节　控制系统的传递函数" data-page="16 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body fill">
    <div class="sec" style="font-size:25px;color:var(--navy)">传递函数 —— 经典控制论中最常用、最重要的数学模型</div>
    <div class="def"><b>定义：</b>在<span class="kw-r">初始条件为零</span>时，系统输出量的拉氏变换 C(s) 与输入量的拉氏变换 R(s) 之比，称为系统的传递函数。通常用 G(s) 或 Φ(s) 表示。</div>
    <div class="row">
      <div class="blk"><div class="sig"><span class="tex">r(t)\ \ R(s)</span></div><div class="arrbig">➜</div></div>
      <div class="blk"><div class="box"><span class="tex">G(s)</span></div></div>
      <div class="blk"><div class="sig"><span class="tex">c(t)\ \ C(s)</span></div><div class="arrbig">➜</div></div>
      <div class="mathbox tex tex-d">G(s) = \dfrac{C(s)}{R(s)}</div>
    </div>
  </div>
  <div class="act-note">
    <svg class="ico" viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="4" fill="none" stroke="#1D3FA0" stroke-width="3"/><path d="M4 24 h6 M38 24 h6" stroke="#1D3FA0" stroke-width="3"/><path d="M18 24 h12" stroke="#F5821F" stroke-width="3.5"/></svg>
    <span><span class="lead">视角：</span>传递函数只关心「输入 → 输出」的外部关系——方框里是什么物理系统并不重要。</span>
  </div>
</div></div>
