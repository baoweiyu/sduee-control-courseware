<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 判断（物理性质与传递函数）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:20px; font-weight:700; border-radius:10px; padding:6px 18px; margin-bottom:26px; }
  .q { font-size:31px; font-weight:700; color:var(--navy); margin-bottom:36px; line-height:1.6; }
  .opts { display:flex; gap:26px; }
  .opt { flex:1; display:flex; align-items:center; justify-content:center; gap:18px; background:#fff; border:2px solid var(--line); border-radius:14px; padding:34px 26px; font-size:28px; color:var(--ink); }
  .opt .k { width:50px; height:50px; border-radius:50%; background:var(--sky); color:var(--blue); font-weight:700; display:grid; place-items:center; flex:none; font-size:25px; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right .k { background:#1E9E57; color:#fff; }
  .opt.right::after { content:"✓"; margin-left:18px; color:#1E9E57; font-weight:800; font-size:30px; }
  .opt.dim { opacity:.5; }
  .ans { margin-top:30px; font-size:25px; color:var(--navy); background:var(--sky); border-radius:14px; padding:18px 28px; }
  .ans b { color:var(--danger); }
</style>
</head>
<body data-title="课堂互动 · 判断" data-page="20 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body" style="display:flex;flex-direction:column;justify-content:center">
    <span class="qtype">判断题　1 分</span>
    <div class="q">物理性质不同的系统，完全可以有相同的传递函数。（　）</div>
    <div class="opts">
      <div class="opt" data-step="1" data-mark="1"><span class="k">A</span>对</div>
      <div class="opt" data-step="2" data-mark="0"><span class="k">B</span>不对</div>
    </div>
    <div data-step="3" style="display:none"></div>
    <div class="ans" data-step="4"><b>答案：A（对）。</b>RLC 电路、弹簧-质量-阻尼器、直流电动机物理本质完全不同，却都是二阶线性模型——传递函数只刻画输入-输出动态关系，与物理载体无关。这正是控制理论能统一研究各类系统的原因。</div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          o.classList.toggle("right", S.cur >= 3 && o.dataset.mark === "1");
          o.classList.toggle("dim", S.cur >= 3 && o.dataset.mark === "0");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
