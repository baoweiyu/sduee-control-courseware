<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 传递函数概念（两题）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .qz { background:#fff; border:2px solid var(--line); border-radius:16px; padding:24px 30px; margin-bottom:26px; }
  .qz .hd2 { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:19px; font-weight:700; border-radius:9px; padding:5px 16px; white-space:nowrap; flex:none; }
  .qz .q { font-size:24.5px; font-weight:700; color:var(--navy); }
  .opts { display:flex; flex-wrap:wrap; gap:16px; }
  .opt { display:flex; align-items:center; gap:14px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:14px 22px; font-size:22px; color:var(--ink); flex:1; min-width:38%; }
  .opt .k { width:40px; height:40px; border-radius:50%; background:var(--sky); color:var(--blue); font-weight:700; display:grid; place-items:center; flex:none; font-size:20px; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right .k { background:#1E9E57; color:#fff; }
  .opt.right::after { content:"✓"; margin-left:auto; color:#1E9E57; font-weight:800; font-size:24px; }
  .opt.dim { opacity:.5; }
  .ans { margin-top:16px; font-size:21.5px; color:var(--navy); background:var(--sky); border-radius:12px; padding:12px 22px; }
  .ans b { color:var(--danger); }
</style>
</head>
<body data-title="课堂互动 · 传递函数概念" data-page="24 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body" style="display:flex;flex-direction:column;justify-content:center">
    <div class="qz">
      <div class="hd2"><span class="qtype">单选　1 分</span><span class="q">① 判断以下说法：1）传递函数完全由系统的结构和参数确定；2）传递函数与输入和初始条件有关。（　）</span></div>
      <div class="opts">
        <div class="opt" data-step="1" data-thr="5" data-mark="1"><span class="k">A</span>1 正确，2 不正确</div>
        <div class="opt" data-step="2" data-thr="5" data-mark="0"><span class="k">B</span>1 不正确，2 正确</div>
        <div class="opt" data-step="3" data-thr="5" data-mark="0"><span class="k">C</span>1、2 都正确</div>
        <div class="opt" data-step="4" data-thr="5" data-mark="0"><span class="k">D</span>1、2 都不正确</div>
      </div>
    </div>
    <div data-step="5" style="display:none"></div>
    <div class="qz">
      <div class="hd2"><span class="qtype">判断　1 分</span><span class="q">② 传递函数只表明输入量与输出量之间的动态联系，不能反映系统内部的信息。（　）</span></div>
      <div class="opts">
        <div class="opt" data-step="6" data-thr="8" data-mark="1"><span class="k">A</span>对</div>
        <div class="opt" data-step="7" data-thr="8" data-mark="0"><span class="k">B</span>不对</div>
      </div>
    </div>
    <div data-step="8" style="display:none"></div>
    <div class="ans" data-step="9"><b>答案：① A；② A（对）。</b>传递函数 = 系统自身结构参数的「外部画像」：与输入、初始条件无关，也不透露内部状态信息。</div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          const thr = +(o.dataset.thr || 2);
          o.classList.toggle("right", S.cur >= thr && o.dataset.mark === "1");
          o.classList.toggle("dim", S.cur >= thr && o.dataset.mark === "0");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
