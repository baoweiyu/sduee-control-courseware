<script>
  document.addEventListener("DOMContentLoaded", () => {
    const S = ACT.step;
    const _next = S.next.bind(S);
    S.next = function () {
      const d = _next();
      if (S.cur >= 1) {
        document.getElementById("stamp").classList.add("on");
        document.querySelectorAll(".opt").forEach(o => {
          if (o.dataset.mark === "1") o.classList.add("right");
        });
        const qm = document.getElementById("qmark35");
        if (qm) { qm.textContent = "G₂"; qm.setAttribute("font-size", "17"); qm.setAttribute("font-style", "italic"); }
      }
      return d;
    };
    const _reset = S.reset.bind(S);
    S.reset = function () {
      _reset();
      document.getElementById("stamp").classList.remove("on");
      document.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong"));
      const qm = document.getElementById("qmark35");
      if (qm) { qm.textContent = "?"; qm.setAttribute("font-size", "20"); qm.removeAttribute("font-style"); }
    };
    window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
  });
  function vote(el) {
    document.querySelectorAll(".opt").forEach(o => {
      if (o !== el && o.dataset.mark !== "1") o.classList.add("wrong");
    });
    ACT.step.next();
  }
</script>
