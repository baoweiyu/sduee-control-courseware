<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 加热炉控制方式（单选）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=218">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=218" defer></script>
<style>
  .cols { display:flex; gap:26px; align-items:stretch; height:720px; }
  .imgc { flex:0 0 540px; overflow:hidden; display:flex; flex-direction:column; }
  .imgc .bd2 { flex:1; display:grid; place-items:center; background:var(--sky); padding:8px; }
  .imgc img { max-width:100%; max-height:100%; object-fit:contain; }
  .imgc .cap { text-align:center; font-size:19px; color:var(--muted); padding:8px 6px 12px; }
  .qc { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:20px; font-weight:700; border-radius:10px; padding:6px 16px; margin-bottom:18px; width:fit-content; }
  .q { font-size:27px; font-weight:700; color:var(--navy); margin-bottom:24px; line-height:1.4; }
  .opts { display:flex; flex-direction:column; gap:16px; }
  .opt { display:flex; align-items:center; gap:16px; background:#fff; border:2px solid var(--line); border-radius:14px; padding:18px 24px; font-size:23px; color:var(--ink); }
  .opt .k { width:44px; height:44px; border-radius:50%; background:var(--sky); color:var(--blue); font-weight:700; display:grid; place-items:center; flex:none; font-size:22px; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right .k { background:#1E9E57; color:#fff; }
  .opt.right::after { content:"✓"; margin-left:auto; color:#1E9E57; font-weight:800; font-size:24px; }
  .opt.dim { opacity:.5; }
  .ans { margin-top:20px; font-size:22px; color:var(--navy); background:var(--sky); border-radius:14px; padding:18px 24px; line-height:1.55; }
  .ans b { color:var(--danger); }
</style>
</head>
<body data-title="课堂互动 · 加热炉控制方式" data-page="51 / 51">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="cols">
      <div class="act-card imgc">
        <div class="bd2"><img src="../../../assets/image2/furnace-heating.png" alt="工业加热炉温度控制系统"></div>
        <div class="cap">加热炉温度控制系统：FFC（前馈）+ FT 测物料流量；TT/TC 测温调温（反馈）；Σ 汇合后驱动燃料阀</div>
      </div>
      <div class="qc">
        <span class="qtype">单选题　2 分</span>
        <div class="q">图示加热炉温度自动控制系统，采用了何种控制方式？（　）</div>
        <div class="opts">
          <div class="opt" data-step="1" data-mark="0"><span class="k">A</span>开环控制</div>
          <div class="opt" data-step="2" data-mark="0"><span class="k">B</span>闭环控制</div>
          <div class="opt" data-step="3" data-mark="0"><span class="k">C</span>前馈控制</div>
          <div class="opt" data-step="4" data-mark="1"><span class="k">D</span>复合控制</div>
        </div>
        <div data-step="5" style="display:none"></div>
        <div class="ans" data-step="6"><b>答案：D 复合控制。</b>系统中既有<b>前馈通道</b>（FT 检测物料流量 q_F → FFC 前馈调节器，提前补偿物料波动），又有<b>反馈通道</b>（TT 测温 → TC 温度调节器，按偏差调节）；两路在 Σ 汇合共同控制燃料阀——前馈 + 反馈 = 复合控制。</div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          o.classList.toggle("right", S.cur >= 5 && o.dataset.mark === "1");
          o.classList.toggle("dim", S.cur >= 5 && o.dataset.mark === "0");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
