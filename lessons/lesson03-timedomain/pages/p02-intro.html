          <div class="bd">

            <span class="kw-r">稳定性</span>、<span class="kw-r">暂态性能</span>和<span class="kw-r">稳态精度</span>。
            它是在时间域内对系统进行分析与设计的<span class="kw-r">直接分析法</span>。
          </div>
        </div>
