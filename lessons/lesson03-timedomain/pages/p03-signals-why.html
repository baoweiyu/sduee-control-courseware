<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>典型输入信号的引入</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=220">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=220" defer></script>
<style>
  .row { display:flex; gap:26px; height:100%; }
  .lcol { flex:1.1; display:flex; flex-direction:column; gap:20px; }
  .rcol { flex:1; display:flex; flex-direction:column; }
  .why { flex:1; display:flex; flex-direction:column; }
  .why .bd { flex:1; font-size:24.5px; line-height:1.75; padding:22px 28px; display:flex; flex-direction:column; justify-content:center; }
  .goals { display:flex; gap:18px; }
  .goal { flex:1; background:var(--sky); border:2px solid var(--line); border-radius:14px; padding:16px 20px; display:flex; gap:14px; align-items:center; }
  .goal .n { width:44px; height:44px; border-radius:50%; background:var(--blue); color:#fff; font-size:21px; font-weight:700; display:grid; place-items:center; flex:none; }
  .goal .t { font-size:21.5px; color:var(--ink); line-height:1.5; }
  .preview { display:flex; gap:14px; }
  .pv { flex:1; text-align:center; background:#fff; border:2px solid var(--line); border-radius:12px; padding:13px 6px; font-size:20px; color:var(--navy); font-weight:700; }
  .pv span { display:block; font-size:16.5px; color:var(--muted); font-weight:400; margin-top:4px; }
  .imgc { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .imgc .bd2 { flex:1; display:grid; place-items:center; background:var(--sky); padding:10px; }
  .imgc img { max-width:100%; max-height:100%; object-fit:contain; }
  .cap2 { padding:10px 18px; font-size:19px; color:var(--muted); background:#fff; border-top:2px solid var(--line); }
</style>
</head>
<body data-title="第一节　系统的时域性能指标" data-page="3 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="row">
      <div class="lcol">
        <div class="act-card why">
          <div class="hd">一、典型输入信号</div>
          <div class="bd">
            <p style="margin:0">作用于控制系统的输入信号是<b>多种多样</b>的，且带有一定的<span class="kw-r">随机性</span>。工程实践中通常假定一些<span class="kw-r">基本的输入函数形式</span>，称之为<span class="kw-r">典型输入信号</span>。</p>
          </div>
        </div>
        <div class="goals">
          <div class="goal"><div class="n">1</div><div class="t">便于对系统进行<b>理论分析</b></div></div>
          <div class="goal"><div class="n">2</div><div class="t">便于对各种控制系统的<b>性能进行比较</b></div></div>
        </div>
        <div class="preview">
          <div class="pv">阶跃函数<span>位置函数</span></div>
          <div class="pv">斜坡函数<span>等速度函数</span></div>
          <div class="pv">抛物线函数<span>等加速度函数</span></div>
          <div class="pv">脉冲函数<span>瞬时冲击</span></div>
          <div class="pv">正弦函数<span>频率响应</span></div>
        </div>
      </div>
      <div class="rcol">
        <div class="act-card imgc">
          <div class="hd">实验室里的信号源</div>
          <div class="bd2"><img src="../../../assets/image2/signal-generator.png" alt="信号发生器与示波器"></div>
          <div class="cap2">信号发生器可产生阶跃、斜坡、脉冲、正弦等标准信号——它们就是典型输入信号的物理来源。</div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</body>
</html>
