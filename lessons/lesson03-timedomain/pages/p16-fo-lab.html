<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>互动实验：时间常数 T 与响应速度</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<link rel="stylesheet" href="../lesson03-svg.css">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .row { display:flex; gap:24px; height:100%; }
  .figc { flex:1.65; display:flex; flex-direction:column; overflow:hidden; }
  .figc .bd2 { flex:1; display:grid; place-items:center; background:#fff; padding:8px 14px; }
  .figc svg { width:100%; height:100%; }
  .ctl { flex:1; display:flex; flex-direction:column; gap:16px; }
  .panel { background:#fff; border:2px solid var(--line); border-radius:14px; padding:18px 22px; }
  .panel .h { font-size:21px; font-weight:700; color:var(--blue); margin-bottom:14px; }
  .sliderow { display:flex; align-items:center; gap:14px; font-size:22px; }
  .sliderow input[type=range] { flex:1; accent-color:var(--orange); height:34px; }
  .sliderow .val { min-width:104px; text-align:center; font-weight:700; color:var(--navy); background:var(--sky); border-radius:10px; padding:6px 12px; font-size:22px; }
  .reads { display:flex; flex-direction:column; gap:12px; }
  .rd { display:flex; justify-content:space-between; align-items:center; background:var(--sky); border-radius:12px; padding:12px 18px; font-size:21.5px; color:var(--ink); }
  .rd b { color:var(--navy); font-size:22.5px; font-style:italic; font-family:var(--font-math); }
  .hint { font-size:18.5px; color:var(--muted); line-height:1.55; }
</style>
</head>
<body data-title="互动实验 · 一阶系统时间常数 T" data-page="17 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="row">
      <div class="act-card figc">
        <div class="hd">单位阶跃响应 <span class="tex" style="font-style:italic">h(t) = 1 - e^{-t/T}</span></div>
        <div class="bd2"><svg id="fig" viewBox="0 0 1000 620"></svg></div>
      </div>
      <div class="ctl">
        <div class="panel">
          <div class="h">拖动滑块改变时间常数 T</div>
          <div class="sliderow">
            <span style="font-style:italic;font-family:var(--font-math);font-size:24px;color:var(--navy)">T</span>
            <input id="sld" type="range" min="0.2" max="1.5" step="0.1" value="1.0">
            <span class="val" id="val">1.0 s</span>
          </div>
        </div>
        <div class="panel" style="flex:1">
          <div class="h">性能指标读数</div>
          <div class="reads">
            <div class="rd"><span>上升时间 t<sub>r</sub> = 2.2T</span><b id="r1">2.20 s</b></div>
            <div class="rd"><span>调节时间 t<sub>s</sub> = 3T（Δ=5%）</span><b id="r2">3.00 s</b></div>
            <div class="rd"><span>调节时间 t<sub>s</sub> = 4T（Δ=2%）</span><b id="r3">4.00 s</b></div>
            <div class="rd"><span>t = T 时的响应值 h(T)</span><b>0.632</b></div>
          </div>
          <div class="hint" style="margin-top:16px">观察：T 增大时曲线变缓、各指标同步变大；T 减小时曲线迅速贴近稳态值。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">结论</span><span class="kw-r">T 越小，响应越快</span>；T 是系统惯性大小的度量，惯性越大响应越慢。</div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const TM = 6, YM = 1.3;
  const X = t => 96 + t / TM * 850;
  const Y = v => 540 - v / YM * 480;
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
  const tx = (x, y, s, o, parent) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 20, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal" }, parent); n.textContent = s; return n; };
  const defs = mk("defs", {});
  const m1 = mk("marker", { id: "a16", markerWidth: 10, markerHeight: 10, refX: 7, refY: 3, orient: "auto" }, defs);
  mk("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#5B6B8C" }, m1);

  // 静态：坐标轴、稳态线、网格
  mk("line", { x1: 96, y1: 540, x2: 960, y2: 540, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a16)" });
  mk("line", { x1: 96, y1: 540, x2: 96, y2: 32, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a16)" });
  tx(950, 600, "t / s", { fs: 20, an: "end", it: true, b: true });
  tx(60, 42, "h(t)", { fs: 21, it: true, b: true });
  tx(74, 546, "O", { fs: 18, fill: "#5B6B8C" });
  window.__tickXs = [];
  for (let i = 1; i <= 6; i++) {
    mk("line", { x1: X(i), y1: 540, x2: X(i), y2: 60, stroke: "#C9D8F2", "stroke-width": 1, "stroke-dasharray": "5 6" });
    window.__tickXs.push({ i, x: X(i), el: tx(X(i), 572, i + "", { fs: 17, fill: "#5B6B8C" }) });
  }
  [[0.5, "0.5"], [1, "1"]].forEach(p => {
    mk("line", { x1: 96, y1: Y(p[0]), x2: 946, y2: Y(p[0]), stroke: p[0] === 1 ? "#F5821F" : "#C9D8F2", "stroke-width": p[0] === 1 ? 2.2 : 1, "stroke-dasharray": p[0] === 1 ? "10 7" : "5 6" });
    tx(80, Y(p[0]) + 6, p[1], { an: "end", fs: 17, fill: "#5B6B8C" });
  });

  // 动态组
  const dyn = mk("g", {});
  function render(T) {
    dyn.innerHTML = "";
    const h = t => t <= 0 ? 0 : 1 - Math.exp(-t / T);
    let d = "";
    for (let i = 0; i <= 300; i++) { const t = TM * i / 300; d += (i ? "L" : "M") + X(t).toFixed(1) + "," + Y(h(t)).toFixed(1); }
    mk("path", { d, stroke: "#2B5CE6", "stroke-width": 3.5, fill: "none" }, dyn);
    // T 点 0.632
    mk("line", { x1: X(T), y1: Y(0.632), x2: X(T), y2: 540, stroke: "#F5821F", "stroke-width": 2, "stroke-dasharray": "8 6" }, dyn);
    mk("line", { x1: 96, y1: Y(0.632), x2: X(T), y2: Y(0.632), stroke: "#F5821F", "stroke-width": 2, "stroke-dasharray": "8 6" }, dyn);
    mk("circle", { cx: X(T), cy: Y(0.632), r: 6.5, fill: "#D63A2F" }, dyn);
    tx(X(T), 566, "T", { fs: 20, b: true, it: true, fill: "#D63A2F" }, dyn);
    tx(X(T) + 16, Y(0.632) - 16, "0.632", { fs: 18, b: true, fill: "#D63A2F", an: "start" }, dyn);
    // 3T 标记（Δ=5%）
    if (3 * T <= TM) {
      mk("line", { x1: X(3 * T), y1: Y(h(3 * T)), x2: X(3 * T), y2: 540, stroke: "#1D3FA0", "stroke-width": 2, "stroke-dasharray": "4 5" }, dyn);
      tx(X(3 * T), 566, "3T", { fs: 19, b: true, it: true }, dyn);
    }
    // 整数刻度与动态 T/3T 标注避让
    (window.__tickXs || []).forEach(tk => {
      const clash = Math.abs(tk.x - X(T)) < 26 || (3 * T <= TM && Math.abs(tk.x - X(3 * T)) < 26);
      tk.el.setAttribute("opacity", clash ? 0 : 1);
    });
    // 读数
    document.getElementById("r1").textContent = (2.2 * T).toFixed(2) + " s";
    document.getElementById("r2").textContent = (3 * T).toFixed(2) + " s";
    document.getElementById("r3").textContent = (4 * T).toFixed(2) + " s";
  }
  const sld = document.getElementById("sld"), val = document.getElementById("val");
  sld.addEventListener("input", () => { const T = +sld.value; val.textContent = T.toFixed(1) + " s"; render(T); });
  render(1.0);
});
</script>
</body>
</html>
