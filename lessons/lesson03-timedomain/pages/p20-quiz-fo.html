<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂互动 · 一阶系统指标</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=220">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=220" defer></script>
<style>
  .qtype { display:inline-block; background:var(--orange); color:#fff; font-size:21px; font-weight:700; border-radius:10px; padding:7px 20px; margin-bottom:20px; }
  .stem { font-size:26px; font-weight:700; color:var(--navy); margin-bottom:20px; line-height:1.5; }
  .qz { background:#fff; border:2px solid var(--line); border-radius:16px; padding:26px 32px; margin-bottom:26px; }
  .qz .qt { font-size:25px; color:var(--navy); font-weight:700; margin-bottom:18px; }
  .opts { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
  .opt { text-align:center; background:var(--sky); border:2px solid var(--line); border-radius:12px; padding:20px 8px; font-size:26px; color:var(--ink); font-family:var(--font-math); font-style:italic; position:relative; }
  .opt.right { border-color:#1E9E57; background:#F0FAF4; }
  .opt.right::after { content:"✓"; position:absolute; top:-14px; right:-10px; width:32px; height:32px; border-radius:50%; background:#1E9E57; color:#fff; font-style:normal; font-weight:800; font-size:20px; display:grid; place-items:center; }
  .ans { font-size:22.5px; color:var(--navy); background:var(--sky); border-radius:12px; padding:14px 24px; margin-top:18px; }
  .ans b { color:var(--danger); }
  .stage-tip { display:inline-block; margin-bottom:18px; font-size:19.5px; color:#fff; background:var(--blue); border-radius:20px; padding:6px 20px; width:fit-content; }
</style>
</head>
<body data-title="课堂互动 · 一阶系统的指标" data-page="21 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body" style="display:flex;flex-direction:column;justify-content:center">
    <span class="qtype">填空题　2 分</span>
    <div class="stem">一阶系统 <span class="tex">\varPhi(s)=\dfrac{1}{Ts+1}</span>（单位负反馈），K = 1。请回答：</div>
    <span class="stage-tip">请先作出你的选择</span>
    <div class="qz">
      <div class="qt">1、调节时间 t<sub>s</sub> =（　）（取误差带 Δ = 5%）</div>
      <div class="opts">
        <div class="opt" data-q="1" data-mark="0">T</div>
        <div class="opt" data-q="1" data-mark="0">2.2T</div>
        <div class="opt" data-q="1" data-mark="1">3T</div>
        <div class="opt" data-q="1" data-mark="0">T²</div>
      </div>
      <div class="ans" data-step="1"><b>答案：3T。</b>h(3T)=0.95，恰好进入 Δ=5% 误差带；若取 Δ=2%，则 t<sub>s</sub>=4T（h(4T)=0.982）。</div>
    </div>
    <div class="qz">
      <div class="qt">2、r(t) = t 时，稳态误差 e<sub>ss</sub> =（　）</div>
      <div class="opts">
        <div class="opt" data-q="2" data-mark="0">0</div>
        <div class="opt" data-q="2" data-mark="1">T</div>
        <div class="opt" data-q="2" data-mark="0">2T</div>
        <div class="opt" data-q="2" data-mark="0">∞</div>
      </div>
      <div class="ans" data-step="2"><b>答案：T。</b>斜坡响应 c(∞)=t−T，输出始终滞后输入一个时间常数，故 e<sub>ss</sub>=T。阶跃输入下 e<sub>ss</sub>=0，切勿混淆。</div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
      function mark() {
        document.querySelectorAll(".opt").forEach(o => {
          const revealed = (+o.dataset.q === 1 && S.cur >= 1) || (+o.dataset.q === 2 && S.cur >= 2);
          o.classList.toggle("right", revealed && o.dataset.mark === "1");
        });
      }
      S.next = function () { const d = _n(); mark(); return d; };
      S.reset = function () { _r(); mark(); };
      window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
    });
  </script>
</div></div>
</body>
</html>
