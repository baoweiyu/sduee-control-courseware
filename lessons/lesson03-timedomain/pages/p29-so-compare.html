<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>四种阻尼的响应对比</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<link rel="stylesheet" href="../lesson03-svg.css">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1fr); gap:18px; height:100%; }
  .cell { display:flex; flex-direction:column; overflow:hidden; min-height:0; min-width:0; }
  .cell .hd { font-size:23px; padding:10px 22px; display:flex; justify-content:space-between; align-items:center; flex:none; }
  .cell .hd .rt { font-size:20px; font-weight:700; color:var(--acc); }
  .cell .bd2 { flex:1; min-height:0; display:grid; place-items:center; background:#fff; padding:4px 10px; }
  .cell svg { width:100%; height:100%; }
  .act-note{font-size:23px;padding:16px 26px}
</style>
</head>
<body data-title="四种阻尼的响应对比" data-page="31 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="grid">
      <div class="act-card cell" data-step="1">
        <div class="hd"><span>① 零阻尼　ζ = 0</span><span class="rt">等幅振荡</span></div>
        <div class="bd2"><svg id="f1" viewBox="0 0 460 260"></svg></div>
      </div>
      <div class="act-card cell" data-step="2">
        <div class="hd"><span>② 欠阻尼　0&lt;ζ&lt;1</span><span class="rt">衰减振荡</span></div>
        <div class="bd2"><svg id="f2" viewBox="0 0 460 260"></svg></div>
      </div>
      <div class="act-card cell" data-step="3">
        <div class="hd"><span>③ 临界阻尼　ζ = 1</span><span class="rt">单调上升·最快</span></div>
        <div class="bd2"><svg id="f3" viewBox="0 0 460 260"></svg></div>
      </div>
      <div class="act-card cell" data-step="4">
        <div class="hd"><span>④ 过阻尼　ζ&gt;1</span><span class="rt">单调上升·缓慢</span></div>
        <div class="bd2"><svg id="f4" viewBox="0 0 460 260"></svg></div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">总览</span>左图看极点、右图看响应：<span class="kw-r">极点越靠左衰减越快，越靠近虚轴（β 越大）振荡越明显。</span></div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  function cell(id, poles, hFn, T) {
    const svg = document.getElementById(id);
    const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
    const tx = (x, y, s, o, parent) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 16, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal" }, parent); n.textContent = s; return n; };
    const defs = mk("defs", {});
    const mid = "am" + id;
    const m1 = mk("marker", { id: mid, markerWidth: 9, markerHeight: 9, refX: 6.5, refY: 2.7, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L6.5,2.7 L0,5.4 Z", fill: "#5B6B8C" }, m1);
    // —— 左：复平面（原点 O(78,140)，半径 80）——
    const O = { x: 78, y: 140 };
    mk("line", { x1: 8, y1: O.y, x2: 166, y2: O.y, stroke: "#5B6B8C", "stroke-width": 1.3, "marker-end": `url(#${mid})` });
    mk("line", { x1: O.x, y1: 250, x2: O.x, y2: 10, stroke: "#5B6B8C", "stroke-width": 1.3, "marker-end": `url(#${mid})` });
    tx(162, O.y + 22, "Re", { fs: 14, it: true, b: true, fill: "#5B6B8C", an: "end" });
    tx(O.x + 20, 22, "jω", { fs: 14, it: true, b: true, fill: "#5B6B8C", an: "start" });
    mk("path", { d: `M ${O.x - 80} ${O.y} A 80 80 0 0 1 ${O.x} ${O.y - 80}`, fill: "none", stroke: "#C9D8F2", "stroke-width": 1.5, "stroke-dasharray": "5 4" });
    mk("path", { d: `M ${O.x} ${O.y + 80} A 80 80 0 0 1 ${O.x - 80} ${O.y}`, fill: "none", stroke: "#C9D8F2", "stroke-width": 1.5, "stroke-dasharray": "5 4" });
    poles.forEach(p => {
      mk("line", { x1: p[0] - 8, y1: p[1] - 8, x2: p[0] + 8, y2: p[1] + 8, stroke: "#D63A2F", "stroke-width": 2.8 });
      mk("line", { x1: p[0] - 8, y1: p[1] + 8, x2: p[0] + 8, y2: p[1] - 8, stroke: "#D63A2F", "stroke-width": 2.8 });
    });
    // —— 右：响应曲线（t 轴 y=225，h 轴 x=196）——
    const X = t => 196 + t / T * 250, Y = v => 225 - v / 2.1 * 195;
    mk("line", { x1: 196, y1: 225, x2: 452, y2: 225, stroke: "#5B6B8C", "stroke-width": 1.3, "marker-end": `url(#${mid})` });
    mk("line", { x1: 196, y1: 225, x2: 196, y2: 14, stroke: "#5B6B8C", "stroke-width": 1.3, "marker-end": `url(#${mid})` });
    tx(452, 250, "t", { fs: 14, it: true, b: true, fill: "#5B6B8C", an: "end" });
    tx(210, 26, "h(t)", { fs: 14, it: true, b: true, fill: "#5B6B8C", an: "start" });
    mk("line", { x1: 196, y1: Y(1), x2: 448, y2: Y(1), stroke: "#F5821F", "stroke-width": 1.6, "stroke-dasharray": "7 5" });
    tx(192, Y(1) + 5, "1", { fs: 13, b: true, an: "end", fill: "#5B6B8C" });
    let d = "";
    for (let i = 0; i <= 300; i++) { const t = T * i / 300; d += (i ? "L" : "M") + X(t).toFixed(1) + "," + Y(hFn(t)).toFixed(1); }
    mk("path", { d, stroke: "#2B5CE6", "stroke-width": 2.8, fill: "none" });
  }
  const O = { x: 78, y: 140 };
  const b55 = 55 * Math.PI / 180, R = 80;
  // ① ζ=0
  cell("f1", [[O.x, O.y - R], [O.x, O.y + R]], t => t <= 0 ? 0 : 1 - Math.cos(t), 4 * Math.PI);
  // ② ζ=0.3
  const z2 = 0.3, sg2 = z2, wd2 = Math.sqrt(1 - z2 * z2), A2 = 1 / Math.sqrt(1 - z2 * z2), be2 = Math.acos(z2);
  cell("f2", [[O.x - R * Math.cos(b55), O.y - R * Math.sin(b55)], [O.x - R * Math.cos(b55), O.y + R * Math.sin(b55)]],
    t => t <= 0 ? 0 : 1 - A2 * Math.exp(-sg2 * t) * Math.sin(wd2 * t + be2), 4 * Math.PI);
  // ③ ζ=1
  cell("f3", [[O.x - 60, O.y]], t => t <= 0 ? 0 : 1 - (1 + t) * Math.exp(-t), 12);
  // ④ ζ=1.5
  const z4 = 1.5, sq = Math.sqrt(z4 * z4 - 1), s1 = -z4 + sq, s2 = -z4 - sq;
  cell("f4", [[O.x - 40, O.y], [O.x - 76, O.y]],
    t => t <= 0 ? 0 : 1 + (1 / (2 * sq)) * (Math.exp(s1 * t) / s1 - Math.exp(s2 * t) / s2), 12);
});
</script>
</body>
</html>
