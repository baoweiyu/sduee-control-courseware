<body data-title="稳定性的基本概念" data-page="51 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="row">
      <div class="lcol">
        <div class="act-card defc">
          <div class="hd">什么是稳定性</div>
          <div class="bd">
            <p>任何系统在<span class="kw-r">扰动</span>作用下都会偏离原平衡状态，<br>产生初始偏差。</p>
            <p><span class="kw-r">稳定性</span>：扰动消失后，系统由初始偏差状态<br><span class="kw-r">恢复到原平衡状态</span>的能力。</p>
            <p>若系统能恢复平衡状态，则称系统是<span class="kw-r">稳定的</span>，否则不稳定。</p>
          </div>
        </div>
        <div class="act-card subc">
          <div class="hd">进一步区分</div>
          <div class="bd">
            <span>① <b>大范围稳定 / 小范围稳定</b>：按初始偏差允许的范围区分；</span>
            <span>② 线性系统的<span class="kw-r">渐近稳定</span>：若稳定，必为大范围稳定。</span>
          </div>
        </div>
      </div>
      <div class="act-card figc">
        <div class="hd">稳定性的直观图景</div>
        <div class="bd2">
          <img src="../../../assets/image2/stability-ball.png" alt="稳定与不稳定的小球">
          <div class="cap">谷底的小球：扰动撤去后回到原平衡位置 —— 稳定；<br>山顶的小球：微小偏离便一去不返 —— 不稳定。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">引导</span><span>"回不回得来"是直观的稳定；要用数学语言回答，需要研究系统的<span class="kw-r">齐次微分方程</span>与<span class="kw-r">特征方程</span>。</span></div>
