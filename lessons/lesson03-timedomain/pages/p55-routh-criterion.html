<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>劳斯判据</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=220">
<script src="../../../theme/mathjax/mathjax-render.js"></script>

<style>
  .col { display:flex; flex-direction:column; gap:22px; height:100%; }
  .critc { flex:1.15; display:flex; flex-direction:column; }
  .critc .bd { flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px; }
  .stmt { display:flex; align-items:center; gap:18px; background:var(--sky); border:2px solid var(--line); border-radius:14px; padding:24px 28px; }
  .sno { flex:none; width:50px; height:50px; border-radius:50%; background:var(--navy); color:#fff; font-size:26px; font-weight:800; display:grid; place-items:center; }
  .stx { font-size:25px; color:var(--navy); line-height:1.6; }
  .necc { flex:1; display:flex; flex-direction:column; }
  .necc .bd { flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; }
  .necline { font-size:23px; color:var(--ink); line-height:1.8; }
  .chips { display:flex; gap:16px; }
  .chip { flex:1; background:#fff; border:2px solid var(--line); border-radius:12px; padding:14px 16px; font-size:21px; color:var(--ink); line-height:1.65; text-align:center; }
</style>
</head>
<body data-title="劳斯判据" data-page="58 / 85">
<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="col">
      <div class="act-card critc">
        <div class="hd">劳斯判据（两条）</div>
        <div class="bd">
          <div class="stmt">
            <div class="sno">1</div>
            <div class="stx">系统稳定的<span class="kw-r">充要条件</span>：劳斯表<span class="kw-r">第一列元素全部大于零</span>。</div>
          </div>
          <div class="stmt">
            <div class="sno">2</div>
            <div class="stx">劳斯表第一列元素<span class="kw-r">符号改变的次数</span>，等于特征方程<span class="kw-r">正实部根的数目</span>。</div>
          </div>
        </div>
      </div>
      <div class="act-card necc">
        <div class="hd">列表之前，先用必要条件"过筛"</div>
        <div class="bd">
          <div class="necline">稳定的<span class="kw-r">必要条件</span>：特征方程各项系数<span class="kw-r">全为正（不缺项）</span>。系数出现 0 或负值 → 可直接判不稳定，不必列表；但系数全正只是必要而不充分，仍须列劳斯表检验。</div>
          <div class="chips">
            <div class="chip"><span class="tex" style="font-size:21px">s^{3}+2s^{2}-s+4=0</span><br>出现负系数 → <span class="kw-r">必不稳定</span></div>
            <div class="chip"><span class="tex" style="font-size:21px">s^{4}+2s^{3}+3s^{2}+4s+5=0</span><br>系数全正 → 需列表（例 3-5）</div>
            <div class="chip"><span class="tex" style="font-size:21px">s^{4}+2s^{3}+s^{2}+2s+1=0</span><br>系数全正 → 需列表（例 3-7）</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</body>
</html>
