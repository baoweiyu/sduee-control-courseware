<div class="act-stage"><div class="act-slide">
  <div class="act-body">
    <div class="col">
      <div class="act-card flowc">
        <div class="hd">稳定性判稳流程总览（劳斯 / 赫尔维茨判据）</div>
        <div class="bd2"><svg id="fig" viewBox="0 0 1340 500"></svg></div>
      </div>
      <div class="act-card nextc">
        <div class="bd"><span>稳定是"<b>定</b>"的问题，误差是"<b>准</b>"的问题 —— 下一节预告：<span class="kw-r">第六节　控制系统的稳态误差</span>。</span></div>
      </div>
    </div>
  </div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
  const defs = mk("defs", {});
  const m1 = mk("marker", { id: "a60", markerWidth: 11, markerHeight: 11, refX: 7.5, refY: 3, orient: "auto" }, defs);
  mk("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#5B6B8C" }, m1);
  function box(x, y, w, h, lines, kind) {
    const style = {
      base:  { fill: "#EAF0FE", stroke: "#1B3B8B" },
      judge: { fill: "#FDF3EC", stroke: "#F5821F" },
      bad:   { fill: "#FCEBE9", stroke: "#D63A2F" },
      good:  { fill: "#EAF6EE", stroke: "#1E9E57" }
    }[kind || "base"];
    mk("rect", { x, y, width: w, height: h, rx: 14, fill: style.fill, stroke: style.stroke, "stroke-width": 2.5 });
    lines.forEach((s, i) => {
      const t = mk("text", { x: x + w / 2, y: y + h / 2 + (i - (lines.length - 1) / 2) * 27 + 8, "font-size": i === 0 ? 22 : 19, "text-anchor": "middle", "font-weight": i === 0 ? 700 : 400, fill: style.stroke });
      t.textContent = s;
    });
  }
  function arrow(x1, y1, x2, y2, via) {
    if (via) mk("polyline", { points: `${x1},${y1} ${via[0]},${via[1]} ${x2},${y2}`, fill: "none", stroke: "#5B6B8C", "stroke-width": 2.5, "marker-end": "url(#a60)" });
    else mk("line", { x1, y1, x2, y2, stroke: "#5B6B8C", "stroke-width": 2.5, "marker-end": "url(#a60)" });
  }
  function alab(x, y, s) { const t = mk("text", { x, y, "font-size": 20, "font-weight": 700, fill: "#D63A2F", "text-anchor": "middle" }); t.textContent = s; }
  box(50, 215, 190, 90, ["特征方程", "D(s) = 0"]);
  box(300, 215, 200, 90, ["系数全为正？", "（必要条件）"], "judge");
  box(560, 85, 230, 85, ["不稳定", "（不必列表）"], "bad");
  box(560, 215, 230, 90, ["列劳斯表", "特例：ε 法 / 辅助方程"]);
  box(850, 215, 200, 90, ["第一列全 > 0？", "（充要条件）"], "judge");
  box(840, 395, 220, 85, ["稳定", "（第一列全正）"], "good");
  box(1100, 215, 215, 90, ["不稳定", "变号次数 = 正实部根数"], "bad");
  arrow(240, 260, 300, 260);
  arrow(400, 215, 558, 128, [400, 128]); alab(384, 165, "否");
  arrow(500, 260, 560, 260); alab(530, 246, "是");
  arrow(790, 260, 850, 260);
  arrow(950, 305, 950, 395); alab(975, 355, "是");
  arrow(1050, 260, 1100, 260); alab(1075, 246, "否");
});
</script>
</body>
</html>
