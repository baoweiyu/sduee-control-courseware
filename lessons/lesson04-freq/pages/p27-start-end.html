<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1.5 起点与终点的确定</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=216">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=216" defer></script>
<style>
  .row { display:flex; gap:26px; height:100%; min-height:0; }
  .cc { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .cc .bd { flex:1; display:flex; flex-direction:column; padding:10px 20px 14px; min-height:0; gap:8px; }
  .fx { text-align:center; font-size:21px; }
  .fx .mathbox { font-size:21.5px; padding:9px 14px; margin:0; }
  .seg { display:flex; gap:10px; justify-content:center; }
  .seg button { background:#fff; border:2px solid var(--blue); color:var(--blue); font-size:19px; font-weight:700; border-radius:10px; padding:6px 20px; cursor:pointer; }
  .seg button.on { background:var(--blue); color:#fff; }
  .fig { flex:1; display:grid; place-items:center; min-height:0; }
  .fig svg { width:100%; height:100%; }
  .ds { font-size:19px; color:var(--ink); line-height:1.55; text-align:center; min-height:60px; }
</style>
</head>
<body data-title="1.5 起点与终点的确定" data-page="27 / 87">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="row">
      <div class="act-card cc">
        <div class="hd">起点（ω→0⁺）：看积分环节个数 ν</div>
        <div class="bd">
          <div class="fx"><span class="tex">\left.G(j\omega)H(j\omega)\right|_{\omega\to0^{+}}\approx\dfrac{K}{(j\omega)^{\nu}}</span></div>
          <div class="seg" id="seg1">
            <button data-v="0" class="on">ν=0</button><button data-v="1">ν=1</button><button data-v="2">ν=2</button>
          </div>
          <div class="fig"><svg id="figS" viewBox="0 0 520 400"></svg></div>
          <div class="ds" id="dsS">ν=0：起点在正实轴上 <b style="color:var(--danger)">K∠0°</b>，是一个确定的点。</div>
        </div>
      </div>
      <div class="act-card cc">
        <div class="hd">终点（ω→∞）：看分母阶次高多少 n−m</div>
        <div class="bd">
          <div class="fx"><span class="tex">n>m:\;0\angle-90^{\circ}(n-m)\;;\quad n=m:\;\text{常数点}</span></div>
          <div class="seg" id="seg2">
            <button data-v="1">n−m=1</button><button data-v="2" class="on">n−m=2</button><button data-v="3">n−m=3</button>
          </div>
          <div class="fig"><svg id="figE" viewBox="0 0 520 400"></svg></div>
          <div class="ds" id="dsE">n−m=2：沿<b style="color:var(--danger)">负实轴</b>方向回到原点（∠=−180°）。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">要点</span><span>起点由 <span class="kw-r">ν</span> 定方位、终点由 <span class="kw-r">n−m</span> 定方向——先看两头，再补交点，Nyquist 曲线的骨架就立起来了。</span></div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  function mkp(svg, mid) {
    const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
    const defs = mk("defs", {});
    const m1 = mk("marker", { id: mid, markerWidth: 9, markerHeight: 9, refX: 6.5, refY: 2.7, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L6.5,2.7 L0,5.4 Z", fill: "#5B6B8C" }, m1);
    const mB = mk("marker", { id: mid + "b", markerUnits: "userSpaceOnUse", markerWidth: 14, markerHeight: 12, refX: 10, refY: 4, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L10,4 L0,8 Z", fill: "#2B5CE6" }, mB);
    const O = { x: 250, y: 200 };
    mk("line", { x1: 20, y1: O.y, x2: 500, y2: O.y, stroke: "#5B6B8C", "stroke-width": 1.4, "marker-end": `url(#${mid})` });
    mk("line", { x1: O.x, y1: 386, x2: O.x, y2: 14, stroke: "#5B6B8C", "stroke-width": 1.4, "marker-end": `url(#${mid})` });
    const MF = "Cambria Math,STIX Two Math,Georgia,Microsoft YaHei,sans-serif";
  const SUB = (n, s) => { const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); let html = "", sub = false; for (const p of String(s).split(/(_\{[^}]*\})/)) { if (!p) continue; if (p.startsWith("_{")) { html += '<tspan' + (sub ? '' : ' dy="6"') + ' font-size="72%">' + esc(p.slice(2, -1)) + '</tspan>'; sub = true; } else { html += sub ? '<tspan dy="-6">' + esc(p) + '</tspan>' : esc(p); sub = false; } } n.innerHTML = html; };
  const tx = (x, y, s, o, parent) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 17, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal" , "font-family": MF }, parent); SUB(n, s); if (o && o.halo) n.setAttribute("style", "paint-order:stroke;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round"); return n; };
    tx(494, O.y + 24, "Re", { fs: 18, it: true, b: true, fill: "#5B6B8C", an: "end" });
    tx(O.x + 20, 24, "jIm", { fs: 18, it: true, b: true, fill: "#5B6B8C", an: "start" });
    tx(O.x - 12, O.y + 22, "O", { fs: 16, fill: "#5B6B8C", an: "end" });
    return { mk, tx, O, dyn: mk("g", {}) };
  }
  // ---- 起点 ----
  const S1 = mkp(document.getElementById("figS"), "a24a");
  const DS = {
    0: "ν=0：起点在正实轴上 K∠0°，是一个确定的点。",
    1: "ν=1：∞∠−90°——从负虚轴的无穷远处出发。",
    2: "ν=2：∞∠−180°——从负实轴的无穷远处出发。"
  };
  function drawS(v) {
    S1.dyn.innerHTML = "";
    const { mk, tx, O } = S1;
    if (v === 0) {
      mk("circle", { cx: O.x + 130, cy: O.y, r: 9, fill: "#D63A2F" }, S1.dyn);
      tx(O.x + 130, O.y - 22, "起点 K", { fs: 20, b: true, it: true, fill: "#D63A2F" }, S1.dyn);
    } else if (v === 1) {
      mk("line", { x1: O.x, y1: 384, x2: O.x, y2: O.y + 60, stroke: "#2B5CE6", "stroke-width": 3.4, "stroke-dasharray": "10 7", "marker-end": "url(#a24ab)" }, S1.dyn);
      tx(O.x + 18, 372, "起点在 −j∞", { fs: 20, b: true, it: true, fill: "#2B5CE6", an: "start" }, S1.dyn);
    } else {
      mk("line", { x1: 22, y1: O.y, x2: O.x - 70, y2: O.y, stroke: "#2B5CE6", "stroke-width": 3.4, "stroke-dasharray": "10 7", "marker-end": "url(#a24ab)" }, S1.dyn);
      tx(60, O.y - 18, "起点在 −∞", { fs: 20, b: true, it: true, fill: "#2B5CE6", an: "start" }, S1.dyn);
    }
    document.getElementById("dsS").innerHTML = DS[v];
  }
  // ---- 终点 ----
  const S2 = mkp(document.getElementById("figE"), "a24b");
  const DE = {
    1: "n−m=1：沿负虚轴方向回到原点（∠=−90°）。",
    2: "n−m=2：沿负实轴方向回到原点（∠=−180°）。",
    3: "n−m=3：沿正虚轴方向回到原点（∠=−270°≡+90°）。"
  };
  function drawE(v) {
    S2.dyn.innerHTML = "";
    const { mk, tx, O } = S2;
    mk("circle", { cx: O.x, cy: O.y, r: 8, fill: "#D63A2F" }, S2.dyn);
    tx(O.x + 12, O.y + 40, "终点=原点", { fs: 19, b: true, fill: "#D63A2F", an: "start" }, S2.dyn);
    if (v === 1) {
      mk("path", { d: `M ${O.x + 130} ${O.y - 150} C ${O.x + 150} ${O.y - 40}, ${O.x} ${O.y + 155}, ${O.x} ${O.y + 132} L ${O.x} ${O.y + 14}`, fill: "none", stroke: "#2B5CE6", "stroke-width": 3.4, "marker-end": "url(#a24bb)" }, S2.dyn);
    } else if (v === 2) {
      mk("path", { d: `M ${O.x + 140} ${O.y - 160} C ${O.x + 170} ${O.y - 50}, ${O.x - 60} ${O.y - 110}, ${O.x - 110} ${O.y - 40} C ${O.x - 130} ${O.y - 12}, ${O.x - 70} ${O.y + 3}, ${O.x - 14} ${O.y - 1}`, fill: "none", stroke: "#2B5CE6", "stroke-width": 3.4, "marker-end": "url(#a24bb)" }, S2.dyn);
    } else {
      mk("path", { d: `M ${O.x + 150} ${O.y + 120} C ${O.x + 165} ${O.y - 20}, ${O.x} ${O.y - 155}, ${O.x} ${O.y - 134} L ${O.x} ${O.y - 14}`, fill: "none", stroke: "#2B5CE6", "stroke-width": 3.4, "marker-end": "url(#a24bb)" }, S2.dyn);
    }
    document.getElementById("dsE").innerHTML = DE[v];
  }
  document.getElementById("seg1").querySelectorAll("button").forEach(b => b.onclick = () => {
    document.getElementById("seg1").querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); drawS(+b.dataset.v);
  });
  document.getElementById("seg2").querySelectorAll("button").forEach(b => b.onclick = () => {
    document.getElementById("seg2").querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); drawE(+b.dataset.v);
  });
  drawS(0); drawE(2);
});
</script>
</body>
</html>
