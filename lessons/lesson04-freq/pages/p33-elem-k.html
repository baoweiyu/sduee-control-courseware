<body data-title="2.2 比例环节的 Bode 图" data-page="33 / 87">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="row">
      <div class="act-card tx">
        <div class="hd"><span class="tex" style="font-size:24px">G(s)=K</span></div>
        <div class="bd">
          <div class="mathbox math eqline tex tex-d">L(\omega)=20\lg K\;\;(\mathrm{dB})</div>
          <div class="mathbox math eqline tex tex-d">\varphi(\omega)=0^{\circ}</div>
          <div>幅频是一条<span class="kw-r">高度 20lgK 的水平线</span>，相频是 0° 水平线；</div>
          <div>K>1 时线在 0dB <span class="kw-r">上方</span>，0&lt;K&lt;1 时在<span class="kw-r">下方</span>；</div>
          <div>K 变化 → 曲线只<span class="kw-r">上下平移</span>。</div>
        </div>
      </div>
      <div class="act-card figc">
        <div class="hd">K = 4 的 Bode 图（两条水平线）</div>
        <div class="bd2"><svg id="fig" viewBox="0 0 860 620"></svg></div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">注意</span><span>比例环节<span class="kw-r">没有转角频率</span>，对任何频率一视同仁——它是最简单的"基准环节"。</span></div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
  const MF = "Cambria Math,STIX Two Math,Georgia,Microsoft YaHei,sans-serif";
  const SUB = (n, s) => { const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); let html = "", sub = false; for (const p of String(s).split(/(_\{[^}]*\})/)) { if (!p) continue; if (p.startsWith("_{")) { html += '<tspan' + (sub ? '' : ' dy="6"') + ' font-size="72%">' + esc(p.slice(2, -1)) + '</tspan>'; sub = true; } else { html += sub ? '<tspan dy="-6">' + esc(p) + '</tspan>' : esc(p); sub = false; } } n.innerHTML = html; };
  const tx = (x, y, s, o) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 17.5, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal" , "font-family": MF }); SUB(n, s); if (o && o.halo) n.setAttribute("style", "paint-order:stroke;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round"); return n; };
  const defs = mk("defs", {});
  const m1 = mk("marker", { id: "a30", markerWidth: 10, markerHeight: 10, refX: 7, refY: 3, orient: "auto" }, defs);
  mk("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#5B6B8C" }, m1);
  function axes(y0, h, yl) {
    const x0 = 90, W = 700, DEC = W / 3;
    const X = w => x0 + (Math.log10(w) + 1) * DEC;
    mk("line", { x1: x0, y1: y0, x2: 830, y2: y0, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a30)" });
    mk("line", { x1: x0, y1: y0, x2: x0, y2: y0 - h, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a30)" });
    [0.1, 1, 10, 100].forEach(w => { const x = X(w); mk("line", { x1: x, y1: y0, x2: x, y2: y0 - h, stroke: "#E4EAF7", "stroke-width": 1 }); tx(x, y0 + 26, String(w >= 1 ? w : "0.1"), { fs: 17.5, fill: "#5B6B8C" }); });
    tx(836, y0 + 6, "ω", { fs: 20, it: true, b: true, fill: "#5B6B8C", an: "start" });
    tx(x0 + 8, y0 - h + 22, yl, { fs: 19, b: true, fill: "#1B3B8B", an: "start" });
    return X;
  }
  // 幅频
  const X1 = axes(300, 220, "L(ω)/dB");
  mk("line", { x1: X1(0.1), y1: 300, x2: X1(100), y2: 300, stroke: "#8AA6D8", "stroke-width": 1.8, "stroke-dasharray": "9 6" });
  tx(824, 292, "0dB", { fs: 17.5, fill: "#5B6B8C", an: "end" });
  // 相频坐标
  const X2 = axes(540, 130, "φ(ω)");
  // 两条水平线（静态完整显示）
  const yL = 300 - 12.04 / 40 * 220;
  mk("line", { x1: X1(0.1), y1: yL, x2: X1(100), y2: yL, stroke: "#2B5CE6", "stroke-width": 3.8 });
  tx(130, yL - 16, "L = 20lg4 ≈ 12dB", { fs: 21, b: true, fill: "#2B5CE6", an: "start" });
  mk("line", { x1: X2(0.1), y1: 540, x2: X2(100), y2: 540, stroke: "#D63A2F", "stroke-width": 3.8 });
  tx(130, 522, "φ = 0°", { fs: 21, b: true, fill: "#D63A2F", an: "start" });
});
</script>
</body>
