<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>互动实验：ζ 与振荡环节 Bode 图</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=218">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=218" defer></script>
<style>
  .row { display:flex; gap:22px; height:100%; }
  .figc { flex:1.55; display:flex; flex-direction:column; overflow:hidden; }
  .figc .bd2 { flex:1; display:grid; place-items:center; background:#fff; padding:6px 12px; }
  .figc svg { width:100%; height:100%; }
  .ctl { flex:1; display:flex; flex-direction:column; gap:13px; }
  .panel { background:#fff; border:2px solid var(--line); border-radius:14px; padding:13px 20px; }
  .panel .h { font-size:20px; font-weight:700; color:var(--blue); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .reg { font-size:17.5px; font-weight:700; color:#fff; background:var(--orange); border-radius:14px; padding:3px 14px; }
  .sliderow { display:flex; align-items:center; gap:12px; font-size:21px; margin:8px 0; }
  .sliderow input[type=range] { flex:1; accent-color:var(--orange); height:30px; }
  .sliderow .val { min-width:86px; text-align:center; font-weight:700; color:var(--navy); background:var(--sky); border-radius:10px; padding:4px 10px; font-size:21px; }
  .sliderow .sy { font-style:italic; font-family:var(--font-math); font-size:23px; color:var(--navy); min-width:34px; }
  .reads { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rd { background:var(--sky); border-radius:11px; padding:9px 14px; font-size:18px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rd b { color:var(--navy); font-size:19.5px; font-style:italic; font-family:var(--font-math); white-space:nowrap; }
  .kpc { flex:1; display:flex; flex-direction:column; justify-content:space-evenly; color:var(--ink); }
  .kpc .kt { font-size:20px; font-weight:800; color:var(--blue); }
  .kpc .ki { display:flex; gap:11px; align-items:flex-start; font-size:19px; line-height:1.58; }
  .kpc .ki .kn { flex:none; width:31px; height:31px; border-radius:50%; background:#E8F0FE; color:var(--blue); font-weight:800; font-size:17px; display:grid; place-items:center; margin-top:2px; }
  .kpc b { color:var(--navy); }
  .presets { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .presets .plab { font-size:18px; color:var(--muted); flex:none; }
  .pb { font-size:17.5px; font-weight:700; color:var(--blue); background:#F6F9FF; border:1.5px solid var(--line); border-radius:9px; padding:4px 14px; cursor:pointer; }
  .pb:hover { background:#E8F0FE; }
</style>
</head>
<body data-title="互动实验：ζ 与振荡环节 Bode 图" data-page="39 / 87">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="row">
      <div class="act-card figc">
        <div class="hd"><span style="flex:1"><span class="tex">G(s)=\dfrac{1}{s^{2}+2\zeta s+1}</span>（ω<sub>n</sub>=1 归一化）的 Bode 图随 ζ 的变化</span></div>
        <div class="bd2"><svg id="figR" viewBox="0 0 1000 780"></svg></div>
      </div>
      <div class="ctl">
        <div class="panel">
          <div class="h">拖动滑块<span class="reg" id="reg">谐振</span></div>
          <div class="sliderow">
            <span class="sy">ζ</span>
            <input id="sz" type="range" min="0.05" max="1.2" step="0.05" value="0.3">
            <span class="val" id="vz">0.30</span>
          </div>
        </div>
        <div class="panel">
          <div class="h">谐振读数（对数坐标）</div>
          <div class="reads">
            <div class="rd"><span>谐振频率 ω<sub>r</sub></span><b id="m-wr">—</b></div>
            <div class="rd"><span>谐振峰 L<sub>r</sub>=20lgM<sub>r</sub></span><b id="m-lr">—</b></div>
            <div class="rd"><span>ω=ω<sub>n</sub> 处精确值 −20lg2ζ</span><b id="m-dp">—</b></div>
            <div class="rd"><span>谐振条件 ζ≤0.707</span><b id="m-ck">—</b></div>
          </div>
        </div>
        <div class="panel kpc">
          <div class="kt">盯住三件事</div>
          <div class="ki"><span class="kn">1</span><div>两条渐近线（橙色虚线）<b>不随 ζ 变化</b>；</div></div>
          <div class="ki"><span class="kn">2</span><div>ζ 越小，ω<sub>n</sub> 附近蓝色精确曲线<span class="kw-r">向上隆起越高</span>；</div></div>
          <div class="ki"><span class="kn">3</span><div>相频曲线在 ω<sub>n</sub> 处恒过 <span class="kw-r">−90°</span>，ζ 越小跳变越陡。</div></div>
          <div class="presets"><span class="plab">快速试试：</span>
            <button class="pb" data-z="0.05">ζ=0.05</button>
            <button class="pb" data-z="0.30">ζ=0.30</button>
            <button class="pb" data-z="0.707">ζ=0.707</button>
            <button class="pb" data-z="1.20">ζ=1.20</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">结论</span><span>振荡环节的渐近线只是骨架，<span class="kw-r">ζ 决定 ωn 附近的修正量</span>：ζ≥0.707 时渐近线近似良好，ζ 很小时必须用精确曲线（或查修正曲线）。</span></div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  const R = document.getElementById("figR");
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || R).appendChild(n); return n; };
  const MF = "Cambria Math,STIX Two Math,Georgia,Microsoft YaHei,sans-serif";
  const SUB = (n, s) => { const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); let html = "", sub = false; for (const p of String(s).split(/(_\{[^}]*\})/)) { if (!p) continue; if (p.startsWith("_{")) { html += '<tspan' + (sub ? '' : ' dy="6"') + ' font-size="72%">' + esc(p.slice(2, -1)) + '</tspan>'; sub = true; } else { html += sub ? '<tspan dy="-6">' + esc(p) + '</tspan>' : esc(p); sub = false; } } n.innerHTML = html; };
  const tx = (x, y, s, o, parent) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 18, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal" , "font-family": MF }, parent); SUB(n, s); if (o && o.halo) n.setAttribute("style", "paint-order:stroke;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round"); return n; };

  const x0 = 92, x1 = 956, DEC = (x1 - x0) / 2;   // ω: 0.1..10
  const X = w => x0 + (Math.log10(w) + 1) * DEC;
  const y0L = 430, yTopL = 70;                     // 幅频区
  const YL = v => y0L - (v + 40) / 62 * (y0L - yTopL);  // L ∈ [-40, 22]
  const y0P = 726, yTopP = 500;                    // 相频区（0° 在上，−180° 在下）
  const YP = v => yTopP + (-v) / 180 * (y0P - yTopP);   // φ ∈ [-180, 0]

  function render(z) {
    R.innerHTML = "";
    const defs = mk("defs", {});
    const m1 = mk("marker", { id: "a36", markerWidth: 10, markerHeight: 10, refX: 7, refY: 3, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#5B6B8C" }, m1);
    const L = w => -10 * Math.log10((1 - w * w) ** 2 + (2 * z * w) ** 2);
    const PH = w => -Math.atan2(2 * z * w, 1 - w * w) * 180 / Math.PI;
    // ===== 幅频坐标 =====
    mk("line", { x1: x0, y1: y0L, x2: x1, y2: y0L, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a36)" });
    mk("line", { x1: x0, y1: y0L, x2: x0, y2: yTopL, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a36)" });
    [0.1, 1, 10].forEach(w => { const x = X(w); mk("line", { x1: x, y1: y0L, x2: x, y2: yTopL, stroke: "#EDF2FB", "stroke-width": 1 }); tx(x, y0L + 24, String(w), { fs: 18, fill: "#5B6B8C" }); });
    [-40, -20, 0, 20].forEach(v => { const y = YL(v); mk("line", { x1: x0, y1: y, x2: x1, y2: y, stroke: v === 0 ? "#8AA6D8" : "#F0F4FC", "stroke-width": v === 0 ? 1.8 : 1, "stroke-dasharray": v === 0 ? "9 6" : "0" }); tx(x0 - 12, y + 6, v + "", { fs: 18, fill: "#5B6B8C", an: "end" }); });
    tx(x1 + 4, y0L + 6, "ω", { fs: 18, it: true, b: true, fill: "#5B6B8C", an: "start" });
    tx(x0 - 12, yTopL - 2, "L/dB", { fs: 18, b: true, fill: "#1B3B8B", an: "end" });
    // 渐近线
    mk("line", { x1: X(0.1), y1: YL(0), x2: X(1), y2: YL(0), stroke: "#F5821F", "stroke-width": 2.6, "stroke-dasharray": "9 6" });
    mk("line", { x1: X(1), y1: YL(0), x2: X(10), y2: YL(-40), stroke: "#F5821F", "stroke-width": 2.6, "stroke-dasharray": "9 6" });
    tx(X(0.32), YL(0) - 12, "渐近线", { fs: 18, fill: "#F5821F" });
    tx(X(5.6), YL(-30), "−40dB/dec", { fs: 18, b: true, fill: "#F5821F" });
    // 精确曲线
    let d = "";
    for (let i = 0; i <= 400; i++) { const w = 0.1 * Math.pow(100, i / 400); d += (i ? "L" : "M") + X(w).toFixed(1) + "," + YL(Math.max(-42, Math.min(24, L(w)))).toFixed(1); }
    mk("path", { d, stroke: "#2B5CE6", "stroke-width": 3.8, fill: "none" });
    // ωn 竖线 + 精确值
    mk("line", { x1: X(1), y1: YL(L(1)), x2: X(1), y2: y0L, stroke: "#1D3FA0", "stroke-width": 1.5, "stroke-dasharray": "6 5" });
    mk("circle", { cx: X(1), cy: YL(L(1)), r: 6.5, fill: "#1D3FA0" });
    tx(X(1) - 14, YL(0) + 34, "ωn：−20lg2ζ=" + L(1).toFixed(1) + "dB", { fs: 18, b: true, fill: "#1D3FA0", an: "end" });
    tx(X(1) + 10, y0L - 14, "ωn = 1", { fs: 18, b: true, fill: "#1D3FA0", an: "start" });
    // 谐振峰
    const has = z <= 0.707;
    if (has) {
      const wr = Math.sqrt(Math.max(0, 1 - 2 * z * z)), mr = 1 / (2 * z * Math.sqrt(1 - z * z)), lr = 20 * Math.log10(mr);
      mk("line", { x1: X(wr), y1: YL(0), x2: X(wr), y2: YL(lr), stroke: "#D63A2F", "stroke-width": 2.2, "stroke-dasharray": "7 5" });
      mk("circle", { cx: X(wr), cy: YL(lr), r: 8, fill: "#D63A2F" });
      tx(X(wr) + 12, YL(lr) - 12, "谐振峰 +" + lr.toFixed(1) + "dB", { fs: 18, b: true, fill: "#D63A2F", an: "start" });
    }
    // ===== 相频坐标 =====
    mk("line", { x1: x0, y1: y0P, x2: x1, y2: y0P, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a36)" });
    mk("line", { x1: x0, y1: y0P, x2: x0, y2: yTopP, stroke: "#5B6B8C", "stroke-width": 1.5, "marker-end": "url(#a36)" });
    [0.1, 1, 10].forEach(w => { const x = X(w); mk("line", { x1: x, y1: y0P, x2: x, y2: yTopP, stroke: "#F0F4FC", "stroke-width": 1 }); tx(x, y0P + 22, String(w), { fs: 18, fill: "#5B6B8C" }); });
    [0, -90, -180].forEach(v => { const y = YP(v); mk("line", { x1: x0, y1: y, x2: x1, y2: y, stroke: "#F0F4FC", "stroke-width": 1 }); tx(x0 - 12, y + 5, v + "°", { fs: 18, fill: "#5B6B8C", an: "end" }); });
    tx(x0 - 12, yTopP - 4, "φ", { fs: 18, b: true, fill: "#1B3B8B", an: "end" });
    let d2 = "";
    for (let i = 0; i <= 400; i++) { const w = 0.1 * Math.pow(100, i / 400); d2 += (i ? "L" : "M") + X(w).toFixed(1) + "," + YP(PH(w)).toFixed(1); }
    mk("path", { d: d2, stroke: "#D63A2F", "stroke-width": 3.4, fill: "none" });
    mk("circle", { cx: X(1), cy: YP(-90), r: 6.5, fill: "#1D3FA0" });
    tx(X(1) + 12, YP(-90) - 10, "−90°", { fs: 18, b: true, fill: "#1D3FA0", an: "start" });
    // ===== 读数 =====
    document.getElementById("m-wr").textContent = has ? Math.sqrt(Math.max(0, 1 - 2 * z * z)).toFixed(3) : "不存在";
    document.getElementById("m-lr").textContent = has ? "+" + (20 * Math.log10(1 / (2 * z * Math.sqrt(1 - z * z)))).toFixed(1) + " dB" : "0 dB（单调）";
    document.getElementById("m-dp").textContent = L(1).toFixed(1) + " dB";
    document.getElementById("m-ck").textContent = has ? "满足 ✓" : "不满足 ✗";
    document.getElementById("reg").textContent = z > 0.707 ? "无谐振" : z >= 0.3 ? "谐振" : "剧烈谐振";
  }
  const sz = document.getElementById("sz"), vz = document.getElementById("vz");
  function upd() { const z = +sz.value; vz.textContent = z.toFixed(2); render(z); }
  sz.addEventListener("input", upd);
  document.querySelectorAll(".pb").forEach(b => b.addEventListener("click", () => { sz.value = b.dataset.z; upd(); }));
  upd();
});
</script>
</body>
</html>
