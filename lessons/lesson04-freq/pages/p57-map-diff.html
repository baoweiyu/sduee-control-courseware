<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3.2 映射原理② 两向量之差 s−z</title>

<style>
  /* ===== T4 双平面统一版式（P55-60 六页严格一致）：顶部模型带 + 两张等大图 + 底部控制与三大读数 ===== */
  .colwrap { display:flex; flex-direction:column; gap:12px; height:100%; min-height:0; }
  .modelband { background:#fff; border:2.5px solid var(--line); border-radius:14px; padding:8px 24px; display:flex; align-items:center; gap:24px; flex:none; height:96px; }
  .modelband .mb { font-size:24px; color:var(--navy); font-weight:700; flex:none; }
  .modelband .mf { font-size:24px; padding:4px 12px; }
  .modelband .q { font-size:23px; color:var(--ink); line-height:1.45; }
  .modelband .q b { color:var(--navy); }
  .figs { display:flex; gap:20px; flex:1; min-height:0; }
  .pc { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .pc .hd { font-size:22px; }
  .pc .bd2 { flex:1; display:grid; place-items:center; background:#fff; padding:2px 8px; min-height:0; }
  .pc svg { width:100%; height:100%; }
  .bigreads { display:flex; gap:16px; align-items:stretch; flex:none; height:96px; }
  .ctl { display:flex; gap:10px; align-items:center; flex:none; }
  .pbtn { border:1.5px solid var(--line); background:#F6F9FF; color:var(--blue); font-size:19px; font-weight:700; border-radius:10px; padding:10px 18px; cursor:pointer; white-space:nowrap; }
  .pbtn:hover { background:#E8F0FE; }
  .bigread { flex:1; background:var(--sky); border-radius:13px; padding:10px 20px; display:flex; flex-direction:column; justify-content:center; }
  .bigread .lab { font-size:19px; font-weight:800; color:var(--blue); }
  .bigread .val { font-size:30px; font-weight:700; color:var(--navy); font-family:var(--font-math); font-style:italic; white-space:nowrap; }
</style>

<body data-title="3.2 映射原理② 两向量之差 s−z" data-page="57 / 88">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="colwrap">
      <div class="modelband">
        <span class="mb">模型：</span>
        <span class="mathbox math mf eqline tex tex-d">F(s)=s-z</span>
        <span class="q"><span class="tex">z=-1</span>（○，在 |s|=0.8 的圆外）。<b>问题：(s−z) 是从 z 指向 s 的向量——s 转一圈，它怎么动？</b></span>
      </div>
      <div class="figs">
        <div class="act-card pc">
          <div class="hd">s 平面：向量 s 与向量 (s−z)</div>
          <div class="bd2"><svg id="figL" viewBox="0 0 470 620"></svg></div>
        </div>
        <div class="act-card pc">
          <div class="hd"><span style="flex:1">F(s) 平面：像 <span class="tex">F(s)=s-z</span></span></div>
          <div class="bd2"><svg id="figR" viewBox="0 0 470 620"></svg></div>
        </div>
      </div>
      <div class="bigreads">
        <div class="ctl">
          <button class="pbtn" id="play">▶ 播放</button>
          <button class="pbtn" id="stepq">◑ ¼ 步进</button>
          <button class="pbtn" id="reset">⟲ 重置</button>
        </div>
        <div class="bigread"><span class="lab">∠(s−z) 当前（左）</span><span class="val" id="r-v1">—</span></div>
        <div class="bigread"><span class="lab">∠F(s) 当前（右）</span><span class="val" id="r-v2">—</span></div>
        <div class="bigread"><span class="lab">一圈累计转角</span><span class="val" id="r-v3">—</span></div>
      </div>
      <div data-step="1" style="display:none"></div>
      <div data-step="2" style="display:none"></div>
      <div data-step="3" style="display:none"></div>
      <div data-step="4" style="display:none"></div>
    </div>
  </div>
  <div class="act-note"><span class="lead">关键直觉</span><span>F(s) 的分子因子 (s−z) 不是抽象符号——它就是左图上<span class="kw-r">从零点 ○ 连到动点 s 的那根向量</span>。零极点与 s 的相对位置，决定像轨迹的形状。</span></div>
</div></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  function panel(id, mid) {
    const svg = document.getElementById(id);
    const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
    const MF = "Cambria Math,STIX Two Math,Georgia,Microsoft YaHei,sans-serif";
    const SUB = (n, s) => { const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); let html = "", sub = false; for (const p of String(s).split(/(_\{[^}]*\})/)) { if (!p) continue; if (p.startsWith("_{")) { html += '<tspan' + (sub ? '' : ' dy="6"') + ' font-size="72%">' + esc(p.slice(2, -1)) + '</tspan>'; sub = true; } else { html += sub ? '<tspan dy="-6">' + esc(p) + '</tspan>' : esc(p); sub = false; } } n.innerHTML = html; };
    const tx = (x, y, s, o, parent) => { const n = mk("text", { x, y, "font-size": (o && o.fs) || 24, "text-anchor": (o && o.an) || "middle", fill: (o && o.fill) || "#1B3B8B", "font-weight": (o && o.b) ? 700 : 400, "font-style": (o && o.it) ? "italic" : "normal", "font-family": MF }, parent); SUB(n, s); if (o && o.halo) n.setAttribute("style", "paint-order:stroke;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round"); return n; };
    const defs = mk("defs", {});
    const m1 = mk("marker", { id: mid, markerWidth: 10, markerHeight: 10, refX: 7, refY: 3, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#5B6B8C" }, m1);
    const mB = mk("marker", { id: mid + "B", markerWidth: 11, markerHeight: 11, refX: 7.5, refY: 3.2, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L7.5,3.2 L0,6.4 Z", fill: "#2B5CE6" }, mB);
    const mR = mk("marker", { id: mid + "R", markerWidth: 11, markerHeight: 11, refX: 7.5, refY: 3.2, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L7.5,3.2 L0,6.4 Z", fill: "#D63A2F" }, mR);
    const mO = mk("marker", { id: mid + "O", markerWidth: 11, markerHeight: 11, refX: 7.5, refY: 3.2, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L7.5,3.2 L0,6.4 Z", fill: "#F5821F" }, mO);
    return { mk, tx, mid };
  }
  function stage(P, mid, capTop) {
    P.mk("line", { x1: 18, y1: 320, x2: 452, y2: 320, stroke: "#5B6B8C", "stroke-width": 1.8, "marker-end": "url(#" + mid + ")" });
    P.mk("line", { x1: 235, y1: 596, x2: 235, y2: 32, stroke: "#5B6B8C", "stroke-width": 1.8, "marker-end": "url(#" + mid + ")" });
    P.tx(446, 352, "Re", { fs: 24, it: true, b: true, fill: "#5B6B8C", an: "end" });
    P.tx(251, 54, "jIm", { fs: 24, it: true, b: true, fill: "#5B6B8C", an: "start" });
    P.tx(221, 350, "O", { fs: 22, fill: "#5B6B8C", an: "end" });
    if (capTop) P.tx(235, 584, capTop, { fs: 22, fill: "#5B6B8C" });
  }
  const OX = 235, OY = 320, US = 105, ZX = -1, R0 = 0.8;
  const X = v => OX + v * US, Y = v => OY - v * US;
  const D = 180 / Math.PI, T = 9000, NP = 240;
  const sPts = [];
  for (let i = 0; i <= NP; i++) { const a = -2 * Math.PI * i / NP; sPts.push([R0 * Math.cos(a), R0 * Math.sin(a)]); }
  const acc = [0];
  for (let i = 1; i <= NP; i++) {
    const a1 = Math.atan2(sPts[i - 1][1], sPts[i - 1][0] - ZX), a2 = Math.atan2(sPts[i][1], sPts[i][0] - ZX);
    let dA = a2 - a1;
    while (dA > Math.PI) dA -= 2 * Math.PI;
    while (dA < -Math.PI) dA += 2 * Math.PI;
    acc.push(acc[i - 1] + dA);
  }
  // ---- 左：s 平面 ----
  const L = panel("figL", "a56l");
  stage(L, "a56l", "|s| = 0.8 的圆（z 在圆外）");
  L.mk("circle", { cx: OX, cy: OY, r: R0 * US, fill: "none", stroke: "#B9C6E4", "stroke-width": 1.8, "stroke-dasharray": "7 5" });
  L.mk("circle", { cx: X(ZX), cy: Y(0), r: 9, fill: "none", stroke: "#D63A2F", "stroke-width": 3.6 });
  L.tx(X(ZX), Y(0) + 36, "z = −1", { fs: 22, b: true, fill: "#D63A2F" });
  const dynL = L.mk("g", {});
  // ---- 右：F 平面 ----
  const Rp = panel("figR", "a56r");
  stage(Rp, "a56r", "像轨迹：圆心 (1, j0)、半径 0.8");
  Rp.mk("circle", { cx: OX, cy: OY, r: 7, fill: "#D63A2F" });
  Rp.tx(219, 352, "原点", { fs: 21, b: true, fill: "#D63A2F", an: "end" });
  Rp.mk("circle", { cx: X(-ZX), cy: Y(0), r: R0 * US, fill: "none", stroke: "#F0C9BE", "stroke-width": 1.8, "stroke-dasharray": "7 5" });
  const dynR = Rp.mk("g", {});
  const r1 = document.getElementById("r-v1"), r2 = document.getElementById("r-v2"), r3 = document.getElementById("r-v3");
  function draw(u) {
    const k = u === 0 ? 0 : Math.max(1, Math.round(u * NP));
    const s = sPts[k];
    const dvx = s[0] - ZX, dvy = s[1];
    dynL.innerHTML = ""; dynR.innerHTML = "";
    if (u > 0) {
      let d = "";
      for (let i = 0; i <= k; i++) d += (i ? "L" : "M") + X(sPts[i][0]).toFixed(1) + "," + Y(sPts[i][1]).toFixed(1);
      L.mk("path", { d, fill: "none", stroke: "#2B5CE6", "stroke-width": 3.8 }, dynL);
    }
    L.mk("line", { x1: OX, y1: OY, x2: X(s[0]), y2: Y(s[1]), stroke: "#2B5CE6", "stroke-width": 3, "marker-end": "url(#a56lB)" }, dynL);
    L.mk("line", { x1: X(ZX), y1: Y(0), x2: X(s[0]), y2: Y(s[1]), stroke: "#2B5CE6", "stroke-width": 3, "stroke-dasharray": "9 6", "marker-end": "url(#a56lB)" }, dynL);
    L.mk("circle", { cx: X(s[0]), cy: Y(s[1]), r: 9, fill: "#2B5CE6" }, dynL);
    L.tx(X(s[0]) + 18, Y(s[1]) - 16, "s", { fs: 26, b: true, it: true, fill: "#2B5CE6" }, dynL);
    const mx = (X(ZX) + X(s[0])) / 2, my = (Y(0) + Y(s[1])) / 2;
    L.tx(mx + 12, my - 12, "(s−z)", { fs: 24, b: true, it: true, fill: "#1D3FA0" }, dynL);
    if (u > 0) {
      let d = "";
      for (let i = 0; i <= k; i++) d += (i ? "L" : "M") + X(sPts[i][0] - ZX).toFixed(1) + "," + Y(sPts[i][1]).toFixed(1);
      Rp.mk("path", { d, fill: "none", stroke: "#D63A2F", "stroke-width": 3.8 }, dynR);
    }
    Rp.mk("line", { x1: OX, y1: OY, x2: X(dvx), y2: Y(dvy), stroke: "#D63A2F", "stroke-width": 3.4, "marker-end": "url(#a56rR)" }, dynR);
    Rp.mk("circle", { cx: X(dvx), cy: Y(dvy), r: 9, fill: "#D63A2F" }, dynR);
    if (X(dvx) > 378) Rp.tx(X(dvx) - 18, Y(dvy) - 16, "F(s)", { fs: 26, b: true, it: true, fill: "#D63A2F", an: "end" }, dynR);
    else Rp.tx(X(dvx) + 18, Y(dvy) - 16, "F(s)", { fs: 26, b: true, it: true, fill: "#D63A2F" }, dynR);
    const ang = Math.atan2(dvy, dvx) * D;
    r1.textContent = ang.toFixed(1) + "°";
    r2.textContent = ang.toFixed(1) + "°";
    r3.textContent = (acc[k] * D).toFixed(1) + "°";
  }
  // ---- 播放控制：播放/暂停、¼ 步进（与 ACT 分步同一进度）、重置 ----
  const playBtn = document.getElementById("play"), stepBtn = document.getElementById("stepq"), resetBtn = document.getElementById("reset");
  let el = 0, playing = false, last = null;
  function syncBtn() { playBtn.textContent = playing ? "⏸ 暂停" : (el >= T ? "▶ 重播" : "▶ 播放"); }
  playBtn.addEventListener("click", () => {
    if (playing) { playing = false; }
    else { if (el >= T) el = 0; playing = true; }
    syncBtn();
  });
  stepBtn.addEventListener("click", () => {
    playing = false;
    el = Math.min(T, (Math.floor(el / (T / 4) + 1e-9) + 1) * (T / 4));
    syncBtn(); draw(el / T);
  });
  resetBtn.addEventListener("click", () => { el = 0; playing = false; syncBtn(); draw(0); });
  window.addEventListener("message", ev => { const m = ev.data || {}; if (m.type === "act-reset") { el = 0; playing = false; syncBtn(); draw(0); } });
  const S = ACT.step, _n = S.next.bind(S), _r = S.reset.bind(S);
  S.next = function () {
    playing = false;
    el = Math.min(T, (Math.floor(el / (T / 4) + 1e-9) + 1) * (T / 4));
    syncBtn(); draw(el / T);
    return _n();
  };
  S.reset = function () { el = 0; playing = false; syncBtn(); _r(); draw(0); };
  window.prev = function () { const n = Math.max(0, S.cur - 1); S.reset(); for (let i = 0; i < n; i++) S.next(); };
  function tick(ts) {
    if (last !== null && playing) el = Math.min(T, el + (ts - last));
    last = ts;
    draw(el / T);
    if (playing && el >= T) { playing = false; syncBtn(); }
    requestAnimationFrame(tick);
  }
  syncBtn();
  requestAnimationFrame(tick);
});
</script>
</body>
