<body data-title="引言：为什么需要根轨迹" data-page="4 / 61">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="col">
      <div class="figrow">
        <div class="imgc"><svg id="pl" viewBox="0 0 620 560" preserveAspectRatio="xMidYMid meet"></svg></div>
        <div class="imgc"><svg id="rs" viewBox="0 0 620 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      </div>
      <div class="capnote"><b>核心问题：</b>已知开环零、极点，当 <span class="tex">K_{1}</span> 从 0 变到 ∞，闭环极点在 s 平面上如何连续移动？——参数变化 → 闭环极点变化 → 响应形态变化。</div>
      <div class="act-card">
        <div class="hd">根轨迹法的特点</div>
        <div class="bd">
          <div class="kv" data-step="1"><span>① <b>图解方法</b>：直观、形象，一眼看出全部可能的闭环极点分布。</span></div>
          <div class="kv" data-step="2"><span>② <b>适合研究参数变化趋势</b>：某一参数（如开环增益 <span class="tex">K_{1}</span>）变化时，系统性能的走向一目了然。</span></div>
          <div class="kv" data-step="3"><span>③ <b>图解与近似</b>：相角条件本身是严格的；手工绘图和由图读数通常是近似的，但足以指导分析与校正。</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">一句话</span><span>根轨迹法把「给一个 <span class="tex">K_{1}</span>、解一次方程」的逐点试算，变成<span class="kw-r">「一图看全」</span>的图解方法。</span></div>
<script>
/* 对照图：同一二阶系统（Δ(s)=s²+2s+K₁）在 K₁=0.5 / 1 / 4 下的闭环极点位置 ↔ 单位阶跃响应。
   极点坐标与响应曲线均由解析式计算（s=−1±√(1−K₁)；ωn=√K₁，ζ=1/√K₁）。 */
document.addEventListener("DOMContentLoaded", () => {
  const NS = "http://www.w3.org/2000/svg";
  const MF = '"Cambria Math","STIX Two Math",Georgia,"Times New Roman","Microsoft YaHei",serif';
  const ZH = '"Microsoft YaHei",sans-serif';
  const NAVY = "#12266E", BLUE2 = "#2B5CE6", MUTED = "#5B6B8C", LINE = "#C9D8F2",
        SKY = "#EEF3FD", GREEN = "#0E7A36", GRAY = "#8A97B5", INK = "#16324F";
  const setup = id => {
    const svg = document.getElementById(id);
    const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
    const tx = (x, y, s, o) => { o = o || {};
      const n = mk("text", { x, y, "font-size": o.fs || 20, "text-anchor": o.an || "middle",
        fill: o.fill || NAVY, "font-weight": o.b ? 700 : 400, "font-style": o.it ? "italic" : "normal",
        "font-family": o.zh ? ZH : MF });
      n.textContent = s;
      n.setAttribute("style", "paint-order:stroke;stroke:#FFF;stroke-width:5;stroke-linejoin:round");
      return n; };
    const defs = mk("defs", {}, svg);
    const m = mk("marker", { id: "ar" + id, markerWidth: 11, markerHeight: 9, refX: 7.5, refY: 3.5, orient: "auto" }, defs);
    mk("path", { d: "M0,0 L8,3.5 L0,7 Z", fill: MUTED }, m);
    const head = title => {
      mk("rect", { x: 10, y: 10, width: 600, height: 48, rx: 16, fill: SKY }, svg);
      mk("rect", { x: 10, y: 34, width: 600, height: 24, fill: SKY }, svg);
      tx(30, 44, title, { fs: 23, b: 1, zh: 1, an: "start" });
    };
    return { svg, mk, tx, head, ar: "url(#ar" + id + ")" };
  };
  const CASES = [
    { K: 0.5, color: GRAY,  poles: [[-0.29, 0], [-1.71, 0]],    lab: "K₁=0.5（单调）" },
    { K: 1,   color: BLUE2, poles: [[-1, 0]],                   lab: "K₁=1（临界）" },
    { K: 4,   color: GREEN, poles: [[-1, 1.73], [-1, -1.73]],   lab: "K₁=4（振荡）" },
  ];

  /* ── 左图：闭环极点位置（s 平面，1:1 等比例） ── */
  {
    const { mk, tx, head, ar } = setup("pl");
    head("闭环极点位置（s 平面）");
    const cx0 = 348, cy0 = 306, SC = 88;
    const PX = v => cx0 + v * SC, PY = v => cy0 - v * SC;
    mk("line", { x1: 56, y1: cy0, x2: 596, y2: cy0, stroke: MUTED, "stroke-width": 2, "marker-end": ar });
    mk("line", { x1: cx0, y1: 530, x2: cx0, y2: 76, stroke: MUTED, "stroke-width": 2, "marker-end": ar });
    tx(588, cy0 + 30, "σ", { fs: 24, it: 1, b: 1, fill: MUTED });
    tx(cx0 + 14, 86, "jω", { fs: 24, it: 1, b: 1, fill: MUTED, an: "start" });
    [-1, -2].forEach(v => { mk("line", { x1: PX(v), y1: cy0 - 6, x2: PX(v), y2: cy0 + 6, stroke: MUTED, "stroke-width": 2 });
      tx(PX(v), cy0 + 32, "−" + (-v), { fs: 20, fill: MUTED }); });
    [1, -1].forEach(v => { mk("line", { x1: cx0 - 6, y1: PY(v), x2: cx0 + 6, y2: PY(v), stroke: MUTED, "stroke-width": 2 });
      tx(cx0 - 12, PY(v) + 7, (v < 0 ? "−1" : "1"), { fs: 20, fill: MUTED, an: "end" }); });
    /* 淡轨迹底轨：实轴段 [−2,0] + 分离后沿 σ=−1 上下两支（解析点） */
    mk("line", { x1: PX(-2), y1: cy0, x2: PX(0), y2: cy0, stroke: "#C9D6F2", "stroke-width": 6, "stroke-linecap": "round" });
    [1, -1].forEach(sg => { let d = "";
      for (let i = 0; i <= 40; i++) { const w = i / 40 * 2.35;
        d += (i ? "L" : "M") + PX(-1).toFixed(1) + "," + PY(sg * w).toFixed(1); }
      mk("path", { d, fill: "none", stroke: "#C9D6F2", "stroke-width": 3 }); });
    /* 方向箭头 */
    const tri = (x, y, deg) => { const g = mk("g", { transform: `translate(${x},${y}) rotate(${deg})` });
      mk("path", { d: "M9,0 L-7,6 L-7,-6 Z", fill: "#7E93C4", stroke: "#fff", "stroke-width": 1 }, g); };
    tri(PX(-0.6), cy0, 180); tri(PX(-1.4), cy0, 0);
    tri(PX(-1), PY(0.7), -90); tri(PX(-1), PY(-0.7), 90);
    /* 开环极点 ×：0 与 −2 */
    [0, -2].forEach(v => [1, -1].forEach(sg => mk("line", { x1: PX(v) - 10, y1: cy0 - sg * 10, x2: PX(v) + 10, y2: cy0 + sg * 10,
      stroke: INK, "stroke-width": 4.5, "stroke-linecap": "round" })));
    tx(PX(0), cy0 - 24, "p₁=0", { fs: 20, b: 1, fill: INK });
    tx(PX(-2), cy0 - 24, "p₂=−2", { fs: 20, b: 1, fill: INK });
    /* 三组闭环极点（解析坐标），颜色与右图曲线一一对应 */
    CASES.forEach(c => c.poles.forEach(p =>
      mk("circle", { cx: PX(p[0]), cy: PY(p[1]), r: 10, fill: c.color, stroke: "#fff", "stroke-width": 2.5 })));
    /* 图例 */
    CASES.forEach((c, i) => { const x = 96 + i * 170;
      mk("circle", { cx: x, cy: 524, r: 8, fill: c.color, stroke: "#fff", "stroke-width": 2 });
      tx(x + 16, 531, c.lab, { fs: 19, b: 1, zh: 1, fill: c.color, an: "start" }); });
  }

  /* ── 右图：对应的单位阶跃响应（解析式逐点计算） ── */
  {
    const { mk, tx, head, ar } = setup("rs");
    head("对应的单位阶跃响应");
    const ox = 92, oy = 500, TX = 470, TY = 380;
    mk("line", { x1: ox, y1: oy, x2: ox + TX + 26, y2: oy, stroke: MUTED, "stroke-width": 2, "marker-end": ar });
    mk("line", { x1: ox, y1: oy, x2: ox, y2: oy - TY - 26, stroke: MUTED, "stroke-width": 2, "marker-end": ar });
    tx(ox + TX + 24, oy + 30, "t", { fs: 24, it: 1, b: 1, fill: MUTED });
    tx(ox - 16, oy - TY - 16, "c(t)", { fs: 24, it: 1, b: 1, fill: MUTED, an: "end" });
    mk("line", { x1: ox, y1: oy - TY / 1.9, x2: ox + TX, y2: oy - TY / 1.9, stroke: LINE, "stroke-width": 2, "stroke-dasharray": "7 6" });
    tx(ox - 12, oy - TY / 1.9 + 7, "1", { fs: 20, fill: MUTED, an: "end" });
    [2, 4, 6, 8].forEach(v => { const x = ox + v / 8 * TX;
      mk("line", { x1: x, y1: oy - 6, x2: x, y2: oy + 6, stroke: MUTED, "stroke-width": 2 });
      tx(x, oy + 30, String(v), { fs: 20, fill: MUTED }); });
    function stepResp(K1, t) {
      const wn = Math.sqrt(K1), z = 1 / wn;
      if (Math.abs(z - 1) < 1e-9) return 1 - Math.exp(-wn * t) * (1 + wn * t);
      if (z > 1) { const wd = wn * Math.sqrt(z * z - 1);
        return 1 - Math.exp(-z * wn * t) * (Math.cosh(wd * t) + z * wn / wd * Math.sinh(wd * t)); }
      const wd = wn * Math.sqrt(1 - z * z);
      return 1 - Math.exp(-z * wn * t) * (Math.cos(wd * t) + z * wn / wd * Math.sin(wd * t));
    }
    const TMAX = 8, CMAX = 1.9;
    CASES.forEach(c => {
      let d = "";
      for (let i = 0; i <= 200; i++) { const t = i / 200 * TMAX, v = stepResp(c.K, t);
        d += (i ? "L" : "M") + (ox + t / TMAX * TX).toFixed(1) + "," + (oy - v / CMAX * TY).toFixed(1); }
      mk("path", { d, fill: "none", stroke: c.color, "stroke-width": 4, "stroke-linecap": "round" });
    });
    tx(230, 222, "K₁=4（振荡）", { fs: 20, b: 1, zh: 1, fill: GREEN });
    tx(470, 268, "K₁=1（临界）", { fs: 20, b: 1, zh: 1, fill: BLUE2 });
    tx(566, 352, "K₁=0.5（单调）", { fs: 20, b: 1, zh: 1, fill: GRAY, an: "end" });
  }
});
</script>
</div></div>
