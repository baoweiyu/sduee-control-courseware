<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>① 参量根轨迹：固定 K₁ 的三幅轨迹（例5-9）</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=219">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=219" defer></script>
<script src="../fig.js?v=219"></script>
<script src="../data/ex59fixed.js?v=219"></script>
<style>
  .wrap{height:100%;min-height:0;display:flex;flex-direction:column;gap:12px}
  .act-card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .top{flex:none}
  .top>.bd{padding:10px 18px;display:grid;grid-template-columns:1.12fr 1fr;gap:10px 22px;font-size:20px;line-height:1.42}
  .eq{background:var(--sky);border-radius:11px;padding:7px 12px;text-align:center;grid-row:span 2;display:flex;align-items:center;justify-content:center}
  .rule{background:var(--sky);border-radius:11px;padding:6px 12px}
  .rule b{color:var(--navy)}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .figcard{position:relative}
  .figcard>.hd{font-size:25px;padding:12px 14px;text-align:center}
  .figcard .sub{flex:none;text-align:center;font-size:17.5px;color:var(--navy);padding:0 8px 4px}
  .plot{flex:1;min-height:0;background:#fff;margin:0 8px;border-radius:9px;overflow:hidden;position:relative}
  .plot svg{width:100%;height:100%;display:block}
  .zbar{position:absolute;right:7px;bottom:7px;display:flex;gap:4px;z-index:2}
  .zbtn{width:31px;height:31px;border:2px solid var(--blue);border-radius:7px;background:rgba(255,255,255,.94);color:var(--blue);font-size:20px;font-weight:700;line-height:1;cursor:pointer;padding:0}
  .zbtn.reset{font-size:14px;width:38px}
  .zbtn:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
  .read{flex:none;display:flex;justify-content:center;gap:7px;margin:5px 7px 0;font-size:16.5px;white-space:nowrap}
  .pill{background:var(--sky);border-radius:8px;padding:4px 8px;color:var(--navy);font-weight:700}
  .pill.stable{background:#E8F3EA;color:#176B34}
  .pill.critical{background:#FFF1DF;color:#9A4E12}
  .pill.unstable{background:#FDECEA;color:var(--danger)}
  .ctl{flex:none;display:flex;justify-content:center;gap:7px;padding:7px 5px 9px}
  .btn{border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;padding:6px 11px;cursor:pointer;white-space:nowrap;min-width:76px}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:4px 9px}
  .btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .prog{font-size:15.5px;color:var(--muted);align-self:center;min-width:34px;text-align:center}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .flash{animation:pulse .8s ease-in-out infinite}
</style>
</head>
<body data-title="① 参量根轨迹：固定 K₁ 的三幅轨迹（例5-9）" data-page="38 / 60">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="wrap">
      <div class="act-card top">
        <div class="hd">先固定 K₁，只让参量 a 变化</div>
        <div class="bd">
          <div class="eq"><span class="tex">s(s+1)(s+a)+K_{1}=0\;\Longleftrightarrow\;1+a\dfrac{s(s+1)}{s^{2}(s+1)+K_{1}}=0</span></div>
          <div class="rule"><b>等效零极点：</b>零点 <span class="tex">0,-1</span>；极点为 <span class="tex">s^{2}(s+1)+K_{1}=0</span> 的三个根。</div>
          <div class="rule"><b>通用法则：</b><span class="tex">n=3,m=2</span>，一条渐近线为 <span class="tex">180^{\circ}</span>；稳定边界 <span class="tex">a(a+1)=K_{1}</span>。</div>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="act-note"><span class="lead">读图</span><span>每幅图只改变 <span class="tex">a</span>：三支从等效极点出发，两支最终止于零点 <span class="tex">0,-1</span>，另一支沿负实轴趋向无穷；<span class="tex">a&gt;a^{*}</span> 时闭环稳定。</span></div>
<div data-step="1" style="display:none"></div><div data-step="2" style="display:none"></div><div data-step="3" style="display:none"></div><div data-step="4" style="display:none"></div>
<div data-step="5" style="display:none"></div><div data-step="6" style="display:none"></div><div data-step="7" style="display:none"></div><div data-step="8" style="display:none"></div>
<div data-step="9" style="display:none"></div><div data-step="10" style="display:none"></div><div data-step="11" style="display:none"></div><div data-step="12" style="display:none"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const CASES = [
    { key:"ex59k05", label:"K₁ = 0.5" },
    { key:"ex59k2",  label:"K₁ = 2" },
    { key:"ex59k10", label:"K₁ = 10" }
  ];
  const grid = document.getElementById("grid");
  const controllers = [];
  CASES.forEach((c, idx) => {
    const card = document.createElement("div");
    card.className = "act-card figcard";
    card.innerHTML = `<div class="hd">${c.label}</div>
      <div class="sub">固定 K₁，a：0 → ∞</div>
      <div class="plot"><svg id="fig${idx}" aria-label="${c.label} 的参量根轨迹"></svg><div class="zbar"><button class="zbtn" id="zp${idx}" title="放大" aria-label="放大第 ${idx+1} 幅图">＋</button><button class="zbtn" id="zm${idx}" title="缩小" aria-label="缩小第 ${idx+1} 幅图">−</button><button class="zbtn reset" id="zr${idx}" title="复位视图" aria-label="复位第 ${idx+1} 幅图">1:1</button></div></div>
      <div class="read"><span class="pill" id="av${idx}">a = 0</span><span class="pill" id="st${idx}">等待绘制</span><span class="prog" id="pg${idx}">0/4</span></div>
      <div class="ctl"><button class="btn" id="pl${idx}">▶ 播放</button><button class="btn ghost" id="nx${idx}">下一步</button><button class="btn ghost" id="rs${idx}">重置</button></div>`;
    grid.appendChild(card);
  });

  CASES.forEach((c, idx) => {
    const F = RL.figure("fig"+idx, c.key, { vw:640, vh:400, static:true, asym:false,
      crossSq:false, pzLabels:false, zoom:true, xlim:[-3.6,1.0], ylim:[-2.6,2.6] });
    const fc = F.f_of_K(F.data.astar);
    let cur = 0, fNow = 0, raf = 0, playing = false;
    const $ = s => document.getElementById(s+idx);
    const stop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; playing = false; $("pl").textContent = "▶ 播放"; };
    function status(f) {
      const a = F.K_of_f(f), ast = F.data.astar;
      $("av").textContent = f >= .999 ? "a → ∞" : "a = " + RL.fmtK(a);
      const st = $("st"); st.className = "pill";
      if (f <= .002) { st.textContent = "等效零极点"; return; }
      if (Math.abs(a-ast) < Math.max(.012,ast*.012)) { st.textContent = "临界稳定"; st.classList.add("critical"); }
      else if (a > ast) { st.textContent = "a > a*，稳定"; st.classList.add("stable"); }
      else { st.textContent = "a < a*，不稳定"; st.classList.add("unstable"); }
    }
    function decorations(f) {
      F.gDyn.innerHTML = "";
      if (cur === 1) {
        const g = F.mk("g", { "class":"flash" }, F.gDyn);
        [...F.data.poles, ...F.data.zeros].forEach(p => F.mk("circle", { cx:F.X(p[0]), cy:F.Y(p[1]), r:20,
          fill:"none", stroke:RL.FOCUS, "stroke-width":3 }, g));
      }
      if (f + 1e-6 >= fc) {
        const w = F.data.crossings[0].w;
        [w,-w].forEach(y => {
          F.mk("rect", { x:F.X(0)-8, y:F.Y(y)-8, width:16, height:16, fill:"#fff", stroke:RL.FOCUS, "stroke-width":3,
            "class":cur === 3 ? "flash" : "" }, F.gDyn);
        });
      }
    }
    function render(f) { fNow = f; F.setAllF(f); decorations(f); status(f); $("pg").textContent = cur + "/4"; }
    function animate(to, done) {
      if (raf) cancelAnimationFrame(raf);
      const from = fNow, t0 = performance.now(), dur = 1450 + 1800*Math.abs(to-from);
      const tick = now => {
        const u = Math.min(1,(now-t0)/dur), f = from+(to-from)*u;
        render(f);
        if (u < 1) raf = requestAnimationFrame(tick); else { raf = 0; if (done) done(); }
      };
      raf = requestAnimationFrame(tick);
    }
    function setStep(n, instant=false) {
      stop(); cur = n;
      const target = [0,0,fc,fc,1][n];
      if (instant || n === 1 || n === 3) render(target); else animate(target);
    }
    $("nx").onclick = () => setStep(cur >= 4 ? 1 : cur+1);
    $("rs").onclick = () => { stop(); cur = 0; render(0); };
    $("pl").onclick = () => {
      if (playing) { stop(); return; }
      stop(); cur = 2; playing = true; $("pl").textContent = "❚❚ 暂停"; render(0);
      const t0 = performance.now(), dur = 6500;
      const tick = now => {
        if (!playing) return;
        const f = Math.min(1,(now-t0)/dur);
        cur = f < fc ? 2 : (f < .995 ? 3 : 4); render(f);
        if (f < 1) raf = requestAnimationFrame(tick); else { stop(); cur = 4; render(1); }
      };
      raf = requestAnimationFrame(tick);
    };
    const zoomBy = factor => { F.view.s=Math.max(F.home.s*.65,Math.min(F.home.s*16,F.view.s*factor));F.render(); };
    $("zp").onclick=()=>zoomBy(1.35);$("zm").onclick=()=>zoomBy(1/1.35);$("zr").onclick=()=>F.resetView();
    F.onView=()=>decorations(fNow);
    controllers.push({ reset:() => { stop(); cur = 0; render(0); }, step:(n,instant=true) => setStep(n,instant), zoomBy, resetView:()=>F.resetView(), fig:F });
    render(0);
  });
  const baseNext = ACT.step.next.bind(ACT.step), baseReset = ACT.step.reset.bind(ACT.step);
  function applyGlobal(k, instant=false) {
    controllers.forEach((ctl,i) => {
      const n = Math.max(0,Math.min(4,k-i*4));
      ctl.step(n,instant || n !== ((k-1)%4+1) || i !== Math.floor((k-1)/4));
    });
  }
  ACT.step.next = function() {
    if (ACT.step.cur >= 12) return true;
    baseNext(); applyGlobal(ACT.step.cur,false); return ACT.step.cur >= 12;
  };
  ACT.step.reset = function() { baseReset(); controllers.forEach(ctl=>ctl.reset()); return 0; };
  window.prev = function() {
    const k=Math.max(0,ACT.step.cur-1); baseReset();
    for(let i=0;i<k;i++)baseNext(); applyGlobal(k,true);
  };
  window.qaFinal = () => { baseReset(); for(let i=0;i<12;i++)baseNext(); applyGlobal(12,true); };
  /* 截图自验：?case=1&step=4；不影响正常课堂操作。 */
  const q = new URLSearchParams(location.search), ci = +(q.get("case")||0), sn = +(q.get("step")||0);
  if (ci >= 1 && ci <= 3 && sn >= 0) controllers[ci-1].step(Math.min(4,sn));
});
</script>
</div></div>
</body>
</html>
