<!DOCTYPE html>

<body data-title="⑥ 开环零极点配置的三大规律" data-page="59 / 61">
<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="col">
      <div class="rulerow">
        <div class="act-card">
          <div class="hd">规律一：增加开环零点</div>
          <div class="bd"><div class="kv">零点把根轨迹向左拉：越靠近虚轴作用越强，稳定裕度提高。</div></div>
        </div>
        <div class="act-card">
          <div class="hd">规律二：增加开环极点</div>
          <div class="bd"><div class="kv">极点把根轨迹向右推：渐近线向右挤，稳定裕度下降。</div></div>
        </div>
        <div class="act-card">
          <div class="hd">规律三：开环偶极子</div>
          <div class="bd"><div class="kv">紧贴的零极点对不改轨迹形状，只把开环增益放大 <span class="tex">z_{c}/p_{c}</span> 倍，改善稳态精度。</div></div>
        </div>
      </div>
      <div class="figrow">
        <div class="act-card figc">
          <div class="bd2">
            <div class="half"><svg id="figA"></svg><div class="tag">加零点前：K₁/[s²(s+2)]，σₐ=−0.67</div></div>
            <div class="half"><svg id="figB"></svg><div class="tag">加零点后：σₐ=−0.75，轨迹左偏</div></div>
          </div>
        </div>
        <div class="act-card figc">
          <div class="bd2c"><svg id="pl" viewBox="0 0 470 300" preserveAspectRatio="xMidYMid meet"></svg></div>
        </div>
        <div class="act-card figc">
          <div class="bd2c"><svg id="dp" viewBox="0 0 470 300" preserveAspectRatio="xMidYMid meet"></svg></div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">要点</span><span>①②互为镜像；③表明<span class="kw-r">动态与稳态可分开设计</span>：偶极子只动增益、不动轨迹。</span></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  RL.figure("figA", "ex516a", { vw: 470, vh: 250, static: true, xlim: [-3.4, 1.2], ylim: [-2, 2], asymLabels: false, sigA: false, pzLabels: false });
  RL.figure("figB", "ex516d", { vw: 470, vh: 250, static: true, xlim: [-3.4, 1.2], ylim: [-2, 2], asymLabels: false, sigA: false, pzLabels: false });
  const NS = "http://www.w3.org/2000/svg";
  const MF = '"Cambria Math","STIX Two Math",Georgia,"Times New Roman","Microsoft YaHei",serif';
  const mks = svg => (tag, attrs) => { const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
  const addArrow = (mk, id, color) => {
    const defs = mk("defs", {});
    const m = document.createElementNS(NS, "marker");
    [["id", id], ["markerWidth", 10], ["markerHeight", 8], ["refX", 7], ["refY", 3], ["orient", "auto"]].forEach(([k, v]) => m.setAttribute(k, v));
    defs.appendChild(m);
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L7,3 L0,6 Z"); p.setAttribute("fill", color); m.appendChild(p);
  };
  const txt = (mk, x, y, s, o) => { o = o || {};
    const n = mk("text", { x, y, "font-size": o.fs || 17, "text-anchor": o.an || "middle",
      fill: o.fill || "#5B6B8C", "font-weight": o.b ? 700 : 400, "font-family": MF });
    n.textContent = s;
    n.setAttribute("style", "paint-order:stroke;stroke:#FFF;stroke-width:5;stroke-linejoin:round"); return n; };

  /* ---- 规律二配图：K₁/[s(s+1)]（两极点）vs 加极点 −2（三极点，数值求根） ---- */
  {
    const svg = document.getElementById("pl"), mk = mks(svg);
    addArrow(mk, "ax59p", "#5B6B8C");
    const X = x => 235 + x * 62, Y = y => 152 - y * 62;   /* x∈[−3.6,1.4]，y∈[−2.3,2.3] */
    mk("line", { x1: 20, y1: Y(0), x2: 456, y2: Y(0), stroke: "#5B6B8C", "stroke-width": 2.2, "marker-end": "url(#ax59p)" });
    mk("line", { x1: X(0), y1: 288, x2: X(0), y2: 12, stroke: "#5B6B8C", "stroke-width": 2.2, "marker-end": "url(#ax59p)" });
    [-3, -2, -1].forEach(v => { mk("line", { x1: X(v), y1: Y(0) - 5, x2: X(v), y2: Y(0) + 5, stroke: "#5B6B8C", "stroke-width": 1.5 }); txt(mk, X(v), Y(0) + 24, String(v), { fs: 15 }); });
    txt(mk, 452, Y(0) - 10, "Re", { fs: 16, b: 1, an: "end" }); txt(mk, X(0) - 14, 26, "Im", { fs: 16, b: 1, an: "end" });
    const cross = (x, color, r) => {
      mk("line", { x1: X(x) - r, y1: Y(0) - r, x2: X(x) + r, y2: Y(0) + r, stroke: color, "stroke-width": 4, "stroke-linecap": "round" });
      mk("line", { x1: X(x) - r, y1: Y(0) + r, x2: X(x) + r, y2: Y(0) - r, stroke: color, "stroke-width": 4, "stroke-linecap": "round" });
    };
    /* 两极点情形：轨迹为 re=−0.5 的竖直平分线（蓝色虚线示意） */
    mk("line", { x1: X(-0.5), y1: Y(-2.2), x2: X(-0.5), y2: Y(2.2), stroke: "#1D3FA0", "stroke-width": 3.4, "stroke-dasharray": "9 6" });
    txt(mk, X(-0.5) - 10, Y(2.05), "两极点：竖直轨迹", { fs: 15.5, fill: "#1D3FA0", b: 1, an: "end" });
    /* 三极点情形：渐近线 ±60°（橙虚线）+ 数值求根分支（橙实线） */
    [[60, 1], [-60, 1]].forEach(([a]) => {
      const th = a * Math.PI / 180, L = 3.1;
      mk("line", { x1: X(-1), y1: Y(0), x2: X(-1 + L * Math.cos(th)), y2: Y(L * Math.sin(th)),
        stroke: "#F5821F", "stroke-width": 2, "stroke-dasharray": "7 5", opacity: .8 });
    });
    RL.tx(svg, X(-1) + 12, Y(0) + 30, "σ_{a}=−1", { fs: 15.5, fill: "#F5821F", b: 1, an: "start" });
    const BR = {"up":[[0.0,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.001,0.0],[-0.002,0.0],[-0.002,0.0],[-0.002,0.0],[-0.002,0.0],[-0.002,0.0],[-0.002,0.0],[-0.002,0.0],[-0.003,0.0],[-0.003,0.0],[-0.003,0.0],[-0.003,0.0],[-0.004,0.0],[-0.004,0.0],[-0.004,0.0],[-0.005,0.0],[-0.005,0.0],[-0.006,0.0],[-0.006,0.0],[-0.007,0.0],[-0.007,0.0],[-0.008,0.0],[-0.008,0.0],[-0.009,0.0],[-0.01,0.0],[-0.011,0.0],[-0.011,0.0],[-0.012,0.0],[-0.014,0.0],[-0.015,0.0],[-0.016,0.0],[-0.017,0.0],[-0.019,0.0],[-0.02,0.0],[-0.022,0.0],[-0.024,0.0],[-0.026,0.0],[-0.028,0.0],[-0.031,0.0],[-0.034,0.0],[-0.037,0.0],[-0.04,0.0],[-0.043,0.0],[-0.047,0.0],[-0.051,0.0],[-0.056,0.0],[-0.061,0.0],[-0.067,0.0],[-0.073,0.0],[-0.08,0.0],[-0.088,0.0],[-0.097,0.0],[-0.107,0.0],[-0.118,0.0],[-0.13,0.0],[-0.144,0.0],[-0.161,0.0],[-0.18,0.0],[-0.203,0.0],[-0.232,0.0],[-0.271,0.0],[-0.332,0.0],[-0.42,0.096],[-0.415,0.168],[-0.409,0.22],[-0.403,0.264],[-0.396,0.305],[-0.39,0.342],[-0.383,0.379],[-0.375,0.413],[-0.367,0.448],[-0.359,0.481],[-0.351,0.515],[-0.342,0.548],[-0.332,0.581],[-0.322,0.614],[-0.312,0.647],[-0.302,0.681],[-0.29,0.715],[-0.279,0.749],[-0.267,0.783],[-0.254,0.818],[-0.241,0.854],[-0.227,0.89],[-0.213,0.926],[-0.198,0.963],[-0.183,1.001],[-0.167,1.04],[-0.151,1.079],[-0.134,1.119],[-0.116,1.159],[-0.098,1.201],[-0.079,1.243],[-0.06,1.286],[-0.039,1.33],[-0.018,1.375],[0.003,1.421],[0.025,1.468],[0.048,1.515],[0.072,1.564],[0.096,1.615],[0.122,1.666],[0.148,1.718],[0.175,1.772],[0.202,1.827],[0.231,1.883],[0.26,1.94],[0.291,1.999],[0.322,2.059],[0.354,2.121],[0.387,2.184],[0.421,2.249],[0.456,2.316]]};
    BR.dn = BR.up.map(p => [p[0], -p[1]]);
    const path = arr => arr.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
    mk("path", { d: path(BR.up), fill: "none", stroke: "#C2410C", "stroke-width": 3.6 });
    mk("path", { d: path(BR.dn), fill: "none", stroke: "#C2410C", "stroke-width": 3.6 });
    mk("line", { x1: X(-2), y1: Y(0), x2: X(-3.55), y2: Y(0), stroke: "#C2410C", "stroke-width": 3.6 });
    mk("line", { x1: X(-1), y1: Y(0), x2: X(-0.02), y2: Y(0), stroke: "#C2410C", "stroke-width": 3.6 });
    txt(mk, X(0.35), Y(-1.7), "加极点 −2：弯向右半平面", { fs: 15.5, fill: "#C2410C", b: 1, an: "end" });
    cross(0, "#16324F", 10); cross(-1, "#16324F", 10); cross(-2, "#C2410C", 10);
    txt(mk, X(0) + 8, Y(0) - 16, "0", { fs: 15, fill: "#16324F", an: "start" });
    txt(mk, X(-1) - 4, Y(0) - 16, "−1", { fs: 15, fill: "#16324F" });
    txt(mk, X(-2) - 4, Y(0) - 16, "−2（新增）", { fs: 15, fill: "#C2410C", b: 1 });
  }

  /* ---- 规律三配图：偶极子示意 ---- */
  {
    const svg = document.getElementById("dp"), mk = mks(svg);
    addArrow(mk, "ax59d", "#5B6B8C");
    const Yc = 150, S = 150;
    const X = x => 250 + x * S;
    mk("line", { x1: 20, y1: Yc, x2: 456, y2: Yc, stroke: "#5B6B8C", "stroke-width": 2.2, "marker-end": "url(#ax59d)" });
    mk("line", { x1: X(0), y1: 282, x2: X(0), y2: 16, stroke: "#5B6B8C", "stroke-width": 2.2, "marker-end": "url(#ax59d)" });
    [-1.5, -1, -0.5].forEach(v => { mk("line", { x1: X(v), y1: Yc - 5, x2: X(v), y2: Yc + 5, stroke: "#5B6B8C", "stroke-width": 1.5 }); txt(mk, X(v), Yc + 24, String(v), { fs: 15 }); });
    txt(mk, 452, Yc - 10, "Re", { fs: 16, b: 1, an: "end" }); txt(mk, X(0) + 12, 30, "Im", { fs: 16, b: 1, an: "start" });
    mk("circle", { cx: X(-0.5), cy: Yc, r: 10, fill: "none", stroke: "#0E7A36", "stroke-width": 4 });
    const cross = (x, color, r) => {
      mk("line", { x1: X(x) - r, y1: Yc - r, x2: X(x) + r, y2: Yc + r, stroke: color, "stroke-width": 4.5, "stroke-linecap": "round" });
      mk("line", { x1: X(x) - r, y1: Yc + r, x2: X(x) + r, y2: Yc - r, stroke: color, "stroke-width": 4.5, "stroke-linecap": "round" });
    };
    cross(-0.05, "#D63A2F", 10);
    RL.tx(svg, X(-0.5), Yc - 24, "○ z_{c}=−0.5", { fs: 16.5, fill: "#0E7A36", b: 1 });
    RL.tx(svg, X(-0.05) + 14, Yc - 24, "× p_{c}=−0.05（紧贴原点）", { fs: 16.5, fill: "#D63A2F", b: 1, an: "start" });
    txt(mk, 235, Yc + 96, "相角/模值贡献近似互消 → 轨迹形状不变", { fs: 16.5, fill: "#B3541E", b: 1 });
    RL.tx(svg, 235, Yc + 126, "增益 K_{c}=K·z_{c}/p_{c}=10K", { fs: 16.5, fill: "#B3541E", b: 1 });
  }
});
</script>
