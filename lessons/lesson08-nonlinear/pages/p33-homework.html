<style>
  .wrap{display:flex;flex-direction:column;gap:16px;height:100%;min-height:0}
  .act-card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .act-card>.bd{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px 26px;min-height:0}
  /* 作业卡：三题横排 */
  .hws{display:flex;gap:18px;align-items:stretch}
  .hw{flex:1;display:flex;gap:12px;align-items:center;background:var(--sky);border:2px solid var(--line);
    border-radius:12px;padding:16px 20px;font-size:21px;color:var(--ink);line-height:1.55}
  .hw .no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;
    font-size:22px;font-weight:800;display:grid;place-items:center}
  .hw b{color:var(--navy)}
  /* 方法回顾卡：五步箭头流程 */
  .flow{display:flex;gap:12px;align-items:center}
  .fstep{flex:1;background:var(--sky);border:2px solid var(--line);border-radius:12px;
    padding:14px 14px;font-size:21px;color:var(--ink);line-height:1.5;text-align:center;font-weight:700}
  .fstep .fn{display:block;color:var(--blue);font-size:21px;margin-bottom:5px}
  .fstep b{color:var(--navy)}
  .farr{flex:none;color:var(--blue);font-size:28px;font-weight:800}
  /* 预告卡 */
  .nx{display:flex;gap:16px;align-items:center;background:var(--sky);border:2px solid var(--line);
    border-radius:12px;padding:14px 24px;font-size:21px;color:var(--ink);line-height:1.6}
  .nx .tag{flex:none;background:var(--navy);color:#fff;border-radius:10px;padding:5px 18px;font-size:21px;font-weight:700}
  .nx b{color:var(--navy)}
</style>
</head>

<div class="act-stage"><div class="act-slide">
  <div class="act-body has-note">
    <div class="wrap">
      <div class="act-card" style="flex:1.06">
        <div class="hd">课后作业</div>
        <div class="bd">
          <div class="hws">
            <div class="hw"><span class="no">1</span><span>描述函数的<b>定义</b>及<b>使用条件</b></span></div>

          </div>
        </div>
      </div>

        <div class="bd">
          <div class="flow">
            <div class="fstep"><span class="fn">①</span>求 <span class="tex">N(X)</span><br>（积分或查表）</div>
            <span class="farr">→</span>
            <div class="fstep"><span class="fn">②</span>画 <span class="tex">G(j\omega)</span> 与 <span class="tex">-1/N(X)</span></div>
            <span class="farr">→</span>
            <div class="fstep"><span class="fn">③</span>判<b>包围 / 相交</b></div>
            <span class="farr">→</span>
            <div class="fstep"><span class="fn">④</span>求交点<br><span class="tex">(X,\omega)</span></div>
            <span class="farr">→</span>
            <div class="fstep"><span class="fn">⑤</span>判<b>自振稳定性</b></div>
          </div>
        </div>
      </div>
      <div class="act-card" style="flex:0.94">

          <div class="nx"><span class="tag">第九章</span><span><b>线性系统的状态空间分析</b>——从输入输出描述（传递函数）走向<b>内部状态描述</b>。</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="act-note"><span class="lead">结语</span><span>描述函数法把非线性问题化为<span class="kw-r">「两条曲线」</span>问题——画图即分析。</span></div>
</div></div>
