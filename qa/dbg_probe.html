<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>dbg</title></head>
<body>
<iframe id="fr" style="width:1448px;height:1086px;border:0"></iframe>
<pre id="out">RUNNING</pre>
<script>
const out = document.getElementById("out");
const fr = document.getElementById("fr");
const lines = [];
const log = s => { lines.push(s); out.textContent = lines.join("\n"); };
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
(async () => {
  fr.src = "../lessons/lesson01-intro/pages/p03-teaching.html";
  for (let i = 0; i < 40; i++) {
    await sleep(300);
    const d = fr.contentDocument;
    if (!d) { log(i + ": no doc"); continue; }
    const slide = d.querySelector(".act-slide");
    const note = d.querySelector(".act-note");
    log(i + ": rs=" + d.readyState + " slide=" + !!slide + " note=" + !!note +
        " bodycls=" + (d.querySelector(".act-body") || {}).className);
    if (slide && note) break;
  }
  const d = fr.contentDocument;
  const note = d && d.querySelector(".act-note");
  if (note) {
    const nr = note.getBoundingClientRect();
    log("note rect: top=" + nr.top.toFixed(1) + " bottom=" + nr.bottom.toFixed(1));
  }
  log("DBG-DONE");
})();
</script>
</body>
</html>
