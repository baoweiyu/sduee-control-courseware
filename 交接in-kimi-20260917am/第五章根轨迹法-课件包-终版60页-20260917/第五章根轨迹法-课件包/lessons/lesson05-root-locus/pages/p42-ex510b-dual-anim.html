<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>例5-10②：180° 与 0° 对照动画</title>
<link rel="stylesheet" href="../../../theme/theme.css?v=505">
<script src="../../../theme/mathjax/mathjax-render.js"></script>
<script src="../../../theme/mathjax/tex-chtml.js"></script>
<script src="../../../theme/mathjax/mjx/input/tex/extensions/color.js"></script>
<script src="../../../theme/act-base.js?v=505" defer></script>
<script src="../fig.js?v=506"></script>
<script src="../data/ex52.js"></script>
<script src="../data/zex52.js"></script>
<style>
  .wrap{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
  .row{display:flex;gap:18px;flex:1;min-height:0}
  .figc{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .figc .bd2{flex:1;display:grid;place-items:center;background:#fff;padding:4px 8px;min-height:0}
  .figc svg{width:100%;height:100%}
  .figc .cap{flex:none;font-size:19px;color:var(--navy);background:var(--sky);border-radius:10px;padding:6px 14px;margin:0 12px 8px;line-height:1.35}
  .segfloat{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;
    border:2px solid var(--blue);border-radius:10px;padding:5px 16px;font-size:18px;font-weight:700;
    color:var(--navy);white-space:nowrap;box-shadow:0 2px 10px rgba(20,40,90,.18)}
  .concl{flex:none;background:#FDF3EC;border-left:6px solid var(--orange);border-radius:0 14px 14px 0;
    padding:8px 18px;font-size:21px;color:var(--navy);line-height:1.4}
  .concl b{color:var(--danger)}
  .ctl{display:flex;flex-direction:column;gap:7px;padding:0 0 8px;flex:none}
  .ctl .ln{display:flex;align-items:center;gap:10px;justify-content:center;white-space:nowrap}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;padding:7px 18px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  .lab{font-size:18px;color:var(--muted);font-weight:700}
  .prog{font-size:18px;color:var(--muted);min-width:64px}
</style>
</head>
<body data-title="例5-10②：180° 与 0° 对照动画" data-page="42 / 60">
<div class="act-stage"><div class="act-slide">

<div class="act-body has-note">
  <div class="wrap">
    <div class="row">
      <div class="act-card figc">
        <div class="hd"><span style="flex:1">负反馈：180° 根轨迹</span></div>
        <div class="bd2"><svg id="figA"></svg></div>
        <div class="cap">实轴段 [−1,0]、(−∞,−2]；分离点 −0.42；K₁&gt;6 过虚轴才失稳</div>
      </div>
      <div class="act-card figc">
        <div class="hd"><span style="flex:1">正反馈：0° 根轨迹</span></div>
        <div class="bd2"><svg id="figB"></svg></div>
        <div class="cap">实轴段 [−2,−1]、[0,+∞)；分离点 −1.58；正实轴一支常驻</div>
      </div>
      <span class="segfloat" id="segChip" style="display:none"></span>
    </div>
    <div class="concl" data-step="4"><b>本例结论：</b>0° 根轨迹恒有一支位于正实轴 [0,+∞) → <b>本例正反馈系统不可能稳定</b>；对照：180°（负反馈）情形 K₁&gt;6 才过虚轴失稳，存在稳定范围 0&lt;K₁&lt;6。</div>
    <div class="ctl">
      <div class="ln">
        <button class="btn" id="play">▶ 同步播放</button>
        <button class="btn ghost" id="step">⧉ 分步</button>
        <button class="btn ghost" onclick="ACT.step.reset()">↺ 重置</button>
        <span class="prog" id="prog">0 / 4</span>
        <span class="lab">同一开环，反馈极性不同 → 两条轨迹</span>
      </div>
      <div class="ln">
        <span class="lab">左图（180°）</span>
        <button class="btn ghost" id="playA">▶ 播放</button>
        <button class="btn ghost" id="rstA">↺ 重置</button>
        <span class="lab" style="margin-left:26px">右图（0°）</span>
        <button class="btn ghost" id="playB">▶ 播放</button>
        <button class="btn ghost" id="rstB">↺ 重置</button>
      </div>
    </div>
  </div>
</div>
<div class="act-note"><span class="lead">要点</span><span>负反馈的不稳定要"穿过虚轴"才发生；正反馈则把不稳定分支<span class="kw-r">直接放在正实轴上</span>——这就是控制系统中极少使用正反馈的根本原因之一（本例结构下）。</span></div>

<div data-step="1" style="display:none"></div><div data-step="2" style="display:none"></div>
<div data-step="3" style="display:none"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const FA = RL.figure("figA", "ex52", { vw: 900, vh: 540 });
  const FB = RL.figure("figB", "zex52", { vw: 900, vh: 540 });
  function paint(K) {}
  RL.wire(4, paint, {
    figs: [FA, FB], FS: [0, 0.3, 0.3, 1, 1], dur: 12000, playLabel: "▶ 同步播放",
    segLabel: txt => { const c = document.getElementById("segChip"); if (!c) return; if (txt) { c.textContent = txt; c.style.display = ""; } else c.style.display = "none"; },
    segments: [
      { label: "① 起步：三条分支各自从开环极点 0、−1、−2 出发", parts: [
        { F: FA, b: [0, 1, 2], f0: 0, f1: 0.3 }, { F: FB, b: [0, 1, 2], f0: 0, f1: 0.3 }] },
      { label: "② 负反馈(180°)：d=−0.42 分离进入复平面，K₁>6 过虚轴失稳", parts: [
        { F: FA, b: [0, 1, 2], f0: 0.3, f1: 1 }] },
      { label: "③ 正反馈(0°)：d=−1.58 分离，正实轴 [0,+∞) 一支常驻 → 恒不稳定", parts: [
        { F: FB, b: [0, 1, 2], f0: 0.3, f1: 1 }] },
    ], segDur: 3800,
    solos: [
      { F: FA, btn: "playA", rst: "rstA", dur: 7000 },
      { F: FB, btn: "playB", rst: "rstB", dur: 7000 },
    ]
  });
});
</script>
</div></div>
</body>
</html>
