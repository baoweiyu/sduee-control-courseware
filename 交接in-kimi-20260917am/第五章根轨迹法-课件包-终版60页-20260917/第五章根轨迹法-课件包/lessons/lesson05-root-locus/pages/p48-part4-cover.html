<script>
document.addEventListener("DOMContentLoaded", () => {
  const F = RL.figure("fig", "ex54", { vw: 720, vh: 560, static: true, asym: false });
  const T = 3.4, c = Math.cos(Math.PI / 3), sn = Math.sin(Math.PI / 3);
  [1, -1].forEach(sg => F.mk("line", { x1: F.X(0), y1: F.Y(0), x2: F.X(-c * T), y2: F.Y(sg * sn * T),
    stroke: RL.REF.color.zeta, "stroke-width": 2.4, "stroke-dasharray": RL.REF.dash.zeta, opacity: .85 }, F.gDyn));
  F.tx(F.gDyn, F.X(-c * 2.9) - 8, F.Y(sn * 2.9) - 6, "ζ=0.5（β=60°）", { fs: 24, fill: RL.REF.color.zeta, b: 1, an: "end" });
  [[-0.4093, 0.7089], [-0.4093, -0.7089]].forEach(p => F.mk("circle", { cx: F.X(p[0]), cy: F.Y(p[1]), r: 10,
    fill: RL.REF.color.zeta, stroke: "#fff", "stroke-width": 2.5 }, F.gDyn));
  F.tx(F.gDyn, F.X(-0.4093) - 4, F.Y(0.7089) - 40, "s_{1,2}=-0.41±j0.71", { fs: 23, fill: RL.REF.color.zeta, b: 1 });
});
